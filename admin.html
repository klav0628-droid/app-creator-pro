<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ease Bharat Connect Admin</title><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:40px auto;padding:20px}.logo{width:100px;height:100px;object-fit:contain;display:block;margin:auto}.box{background:#fff;padding:25px;border-radius:14px;box-shadow:0 4px 18px #0001;margin-top:20px}input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #dce2eb;border-radius:8px;box-sizing:border-box}button{background:#1262df;color:#fff;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;margin:4px 4px 4px 0}.secondary{background:#44546a}.danger{background:#dc3545}.hidden{display:none}.msg{padding:10px;margin:10px 0;border-radius:8px;background:#eef5ff}.success{background:#e8f8ee;color:#176b35}.error{background:#fff0f0;color:#a11}.loading{opacity:.7;pointer-events:none}</style></head><body><div class="wrap"><a href="index.html">← Website</a><img class="logo" src="logo.svg" alt="Ease Bharat Connect"><h1 style="text-align:center">Ease Bharat Connect — Admin</h1><div class="box" id="login"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn" onclick="login()">Login</button><button class="secondary" id="createBtn" onclick="createAdmin()">Create first admin account</button><p id="msg"></p></div><div class="box hidden" id="panel"><h2>Add Service</h2><input id="name" placeholder="Service / Business Name"><input id="city" placeholder="City"><input id="phone" placeholder="Phone"><textarea id="desc" placeholder="Description"></textarea><label><input id="verified" type="checkbox" style="width:auto"> Verified</label><br><button onclick="add()">Add Service</button> <button class="danger" onclick="logout()">Logout</button><p id="out"></p></div></div><script>const API='https://pkofzvbdeljsksecbqzg.supabase.co/functions/v1/ease-api';let token='';const $=id=>document.getElementById(id);function showMsg(text,ok=false){$('msg').textContent=text;$('msg').className=ok?'msg success':'msg error'}async function createAdmin(){const e=$('email').value.trim(),p=$('pass').value;if(!e||!p){showMsg('Email और password भरें। Password कम से कम 8 characters का होना चाहिए।');return}if(p.length<8){showMsg('Password कम से कम 8 characters का होना चाहिए।');return}$('createBtn').disabled=true;showMsg('Creating account...');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'bootstrap',email:e,password:p})});const d=await r.json().catch(()=>({}));if(!r.ok){showMsg(d.error||('Account creation failed (HTTP '+r.status+')'));return}showMsg('Admin account बन गया। अब Login दबाएँ।',true)}catch(err){showMsg('Server connection error: '+err.message)}finally{$('createBtn').disabled=false}}async function login(){const e=$('email').value.trim(),p=$('pass').value;if(!e||!p){showMsg('Email और password भरें।');return}$('loginBtn').disabled=true;showMsg('Logging in...');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email:e,password:p})});const d=await r.json().catch(()=>({}));if(!r.ok){showMsg(d.error||('Login failed (HTTP '+r.status+')'));return}token=d.session.access_token;sessionStorage.setItem('ease_admin_token',token);$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('msg').textContent=''}catch(err){showMsg('Server connection error: '+err.message)}finally{$('loginBtn').disabled=false}}async function add(){if(!token)return;const service={name:$('name').value.trim(),city:$('city').value.trim(),phone:$('phone').value.trim(),description:$('desc').value.trim(),verified:$('verified').checked,active:true};if(!service.name){$('out').textContent='Service name is required';return}try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'add',service})});const d=await r.json().catch(()=>({}));$('out').textContent=r.ok?'Service added successfully!':(d.error||'Error');if(r.ok){$('name').value='';$('city').value='';$('phone').value='';$('desc').value='';$('verified').checked=false}}catch(e){$('out').textContent='Server connection error: '+e.message}}function logout(){token='';sessionStorage.removeItem('ease_admin_token');$('panel').classList.add('hidden');$('login').classList.remove('hidden')}const saved=sessionStorage.getItem('ease_admin_token');if(saved){token=saved;$('login').classList.add('hidden');$('panel').classList.remove('hidden')}</script></body></html>
