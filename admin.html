<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ease Bharat Connect — Admin</title><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:40px auto;padding:20px}.logo{width:100px;height:100px;object-fit:contain;display:block;margin:auto}.box{background:#fff;padding:25px;border-radius:14px;box-shadow:0 4px 18px #0001;margin-top:20px}input,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #dce2eb;border-radius:8px;box-sizing:border-box}input[type=file]{padding:10px;background:#f8fafc}button{background:#1262df;color:#fff;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;margin:4px 4px 4px 0}.secondary{background:#44546a}.danger{background:#dc3545}.hidden{display:none}.msg{padding:10px;margin:10px 0;border-radius:8px;background:#eef5ff}.success{background:#e8f8ee;color:#176b35}.error{background:#fff0f0;color:#a11}.preview{max-width:160px;max-height:120px;border-radius:8px;margin:5px 0 12px;display:none}.progress{font-size:13px;color:#475569}</style></head><body><div class="wrap"><a href="index.html">← Website</a><img class="logo" src="logo.svg" alt="Ease Bharat Connect"><h1 style="text-align:center">Ease Bharat Connect — Admin</h1><div class="box" id="login"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email" autocomplete="username"><input id="pass" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn" onclick="login()">Login</button><button class="secondary" id="createBtn" onclick="createAdmin()">Create first admin account</button><p id="msg"></p></div><div class="box hidden" id="panel"><h2>Add Service</h2><input id="name" placeholder="Service / Business Name"><label>Business Logo</label><input id="businessLogo" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onchange="previewFile(this,'logoPreview')"><img id="logoPreview" class="preview"><label>Service Photo</label><input id="servicePhoto" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewFile(this,'photoPreview')"><img id="photoPreview" class="preview"><label>Service Video</label><input id="serviceVideo" type="file" accept="video/mp4,video/webm,video/quicktime" onchange="showVideoName(this)"><div id="videoName" class="progress"></div><input id="city" placeholder="City"><input id="phone" placeholder="Phone"><textarea id="desc" placeholder="Description"></textarea><label><input id="verified" type="checkbox" style="width:auto"> Verified</label><br><button id="addBtn" onclick="add()">Add Service</button> <button class="danger" onclick="logout()">Logout</button><p id="out"></p></div></div><script>const API='https://pkofzvbdeljsksecbqzg.supabase.co/functions/v1/ease-api',SUPA='https://pkofzvbdeljsksecbqzg.supabase.co/storage/v1/object/service-images/';let token='';const $=id=>document.getElementById(id);function showMsg(text,ok=false){$('msg').textContent=text;$('msg').className=ok?'msg success':'msg error'}async function createAdmin(){const e=$('email').value.trim(),p=$('pass').value;if(!e||p.length<8){showMsg('Email भरें और password कम से कम 8 characters का रखें।');return}$('createBtn').disabled=true;showMsg('Creating account...');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'bootstrap',email:e,password:p})});const d=await r.json().catch(()=>({}));if(!r.ok){showMsg(d.error||('Account creation failed (HTTP '+r.status+')'));return}showMsg('Admin account बन गया। अब Login दबाएँ।',true)}catch(err){showMsg('Server connection error: '+err.message)}finally{$('createBtn').disabled=false}}async function login(){const e=$('email').value.trim(),p=$('pass').value;if(!e||!p){showMsg('Email और password भरें।');return}$('loginBtn').disabled=true;showMsg('Logging in...');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email:e,password:p})});const d=await r.json().catch(()=>({}));if(!r.ok){showMsg(d.error||('Login failed (HTTP '+r.status+')'));return}token=d.session.access_token;sessionStorage.setItem('ease_admin_token',token);$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('msg').textContent=''}catch(err){showMsg('Server connection error: '+err.message)}finally{$('loginBtn').disabled=false}}function previewFile(el,id){const f=el.files[0];if(!f)return;const img=$(id);img.src=URL.createObjectURL(f);img.style.display='block'}function showVideoName(el){$('videoName').textContent=el.files[0]?('Selected: '+el.files[0].name):''}async function upload(file,type){if(!file)return null;const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const path=token.slice(0,8)+'/'+Date.now()+'-'+type+'-'+safe;const r=await fetch(SUPA+encodeURIComponent(path),{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});if(!r.ok){const t=await r.text();throw new Error(type+' upload failed: '+t)}return SUPA+path}async function add(){if(!token)return;const name=$('name').value.trim();if(!name){$('out').textContent='Service name is required';return}$('addBtn').disabled=true;$('out').textContent='Uploading files...';try{const [logo,photo,video]=await Promise.all([upload($('businessLogo').files[0],'logo'),upload($('servicePhoto').files[0],'photo'),upload($('serviceVideo').files[0],'video')]);const service={name,city:$('city').value.trim(),phone:$('phone').value.trim(),description:$('desc').value.trim(),verified:$('verified').checked,active:true,business_logo_url:logo,service_photo_url:photo,service_video_url:video};const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'add',service})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Service save failed');$('out').textContent='Service + logo + photo + video successfully added!';$('name').value='';$('city').value='';$('phone').value='';$('desc').value='';$('verified').checked=false;$('businessLogo').value='';$('servicePhoto').value='';$('serviceVideo').value='';$('logoPreview').style.display='none';$('photoPreview').style.display='none';$('videoName').textContent=''}catch(e){$('out').textContent=e.message}finally{$('addBtn').disabled=false}}function logout(){token='';sessionStorage.removeItem('ease_admin_token');$('panel').classList.add('hidden');$('login').classList.remove('hidden')}const saved=sessionStorage.getItem('ease_admin_token');if(saved){token=saved;$('login').classList.add('hidden');$('panel').classList.remove('hidden')}</script></body></html>
