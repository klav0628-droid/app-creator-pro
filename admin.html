<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ease Bharat Connect Admin</title><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.wrap{max-width:900px;margin:40px auto;padding:20px}.box{background:#fff;padding:25px;border-radius:14px;box-shadow:0 4px 18px #0001}input,textarea,select{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #dce2eb;border-radius:8px;box-sizing:border-box}button{background:#1262df;color:#fff;border:0;padding:12px 20px;border-radius:8px;cursor:pointer}.danger{background:#dc3545}.hidden{display:none}.msg{padding:10px;margin:10px 0;border-radius:8px;background:#eef5ff}</style></head><body><div class="wrap"><a href="index.html">← Website</a><h1>Ease Bharat Connect — Admin</h1><div class="box" id="login"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="msg"></p></div><div class="box hidden" id="panel"><h2>Add Service</h2><input id="name" placeholder="Service / Business Name"><input id="city" placeholder="City"><input id="phone" placeholder="Phone"><textarea id="desc" placeholder="Description"></textarea><label><input id="verified" type="checkbox"> Verified</label><br><button onclick="add()">Add Service</button> <button class="danger" onclick="logout()">Logout</button><p id="out"></p></div></div><script>const API='https://pkofzvbdeljsksecbqzg.supabase.co/functions/v1/ease-api';let token='';async function login(){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email:email.value,password:pass.value})});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Login failed';return}token=d.session.access_token;login.classList.add('hidden');panel.classList.remove('hidden')}async function add(){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'add',service:{name:name.value,city:city.value,phone:phone.value,description:desc.value,verified:verified.checked,active:true}})});const d=await r.json();out.textContent=r.ok?'Service added successfully!':(d.error||'Error')}function logout(){token='';panel.classList.add('hidden');login.classList.remove('hidden')}</script></body></html>
