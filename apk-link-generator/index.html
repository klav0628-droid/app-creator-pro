<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APK Link Generator</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial;margin:0;background:#f4f7fb}.card{max-width:650px;margin:60px auto;background:#fff;padding:30px;border-radius:20px;box-shadow:0 10px 35px #0001}h1{margin-top:0}.drop{display:block;padding:45px;border:2px dashed #9aa4b2;border-radius:16px;text-align:center;cursor:pointer}.drop strong{display:block;font-size:20px;margin-bottom:8px}input{display:none}button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}.result{margin-top:20px;padding:15px;background:#ecfdf3;border-radius:12px}.link{word-break:break-all;background:#fff;padding:10px;border-radius:8px;margin-top:10px}.download{display:block;text-align:center;background:#16a34a;color:white;text-decoration:none;padding:12px;border-radius:9px;margin-top:10px}.msg{margin-top:15px}</style></head><body><div class="card"><h1>📦 APK Link Generator</h1><p>APK upload करें और direct download link पाएं।</p><label class="drop"><strong id="name">APK चुनें</strong><span>केवल .apk file</span><input id="file" type="file" accept=".apk,application/vnd.android.package-archive"></label><button id="upload">Upload & Generate Link</button><div id="msg" class="msg"></div><div id="result"></div></div><script>const SUPABASE_URL='YOUR_SUPABASE_URL';const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const file=document.getElementById('file');const name=document.getElementById('name');file.onchange=()=>{if(file.files[0])name.textContent=file.files[0].name};document.getElementById('upload').onclick=async()=>{const f=file.files[0];const msg=document.getElementById('msg');const result=document.getElementById('result');result.innerHTML='';if(!f){msg.textContent='पहले APK चुनें।';return}if(!f.name.toLowerCase().endsWith('.apk')){msg.textContent='केवल APK file allowed है।';return}msg.textContent='Uploading...';const path=crypto.randomUUID()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const {error}=await sb.storage.from('apks').upload(path,f,{contentType:'application/vnd.android.package-archive',upsert:false});if(error){msg.textContent='Upload error: '+error.message;return}const {data}=sb.storage.from('apks').getPublicUrl(path);msg.textContent='Upload सफल!';result.innerHTML='<div class="result"><b>Download Link:</b><div class="link">'+data.publicUrl+'</div><a class="download" href="'+data.publicUrl+'" download>⬇ APK Download</a></div>'};</script></body></html>
