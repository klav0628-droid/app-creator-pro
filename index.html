<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INDIA Play STORE</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:14px 5%;display:flex;gap:15px;align-items:center;position:sticky;top:0;z-index:3}.logo{font-size:23px;font-weight:800;color:#635bff;white-space:nowrap}.search{flex:1}.search input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}.btn{border:0;border-radius:10px;padding:11px 16px;background:#635bff;color:#fff;font-weight:700;cursor:pointer}.hero{max-width:1100px;margin:28px auto;padding:0 18px}.heroBox{background:linear-gradient(135deg,#635bff,#8b5cf6);color:#fff;border-radius:22px;padding:35px}.hero h1{margin:0 0 8px;font-size:34px}.wrap{max-width:1100px;margin:auto;padding:0 18px 50px}.cats{display:flex;gap:9px;overflow:auto;padding:5px 0 18px}.cat{border:1px solid #ddd;background:#fff;border-radius:99px;padding:9px 15px;white-space:nowrap}.active{background:#635bff;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:17px}.head{display:flex;gap:12px}.icon{width:62px;height:62px;border-radius:15px;background:#eef0ff;display:grid;place-items:center;font-size:31px;overflow:hidden}.icon img{width:100%;height:100%;object-fit:cover}.card h3{margin:3px 0}.muted{color:#777;font-size:13px}.desc{color:#5d6678;min-height:42px}.meta{display:flex;justify-content:space-between;font-size:13px;color:#667085;margin:10px 0}.download,.demo{width:100%;padding:10px;border-radius:9px;font-weight:700;cursor:pointer}.download{border:0;background:#635bff;color:#fff}.demo{margin-top:8px;border:1px solid #635bff;background:#fff;color:#635bff}.empty{text-align:center;background:#fff;padding:35px;border-radius:15px;grid-column:1/-1}.modal{position:fixed;inset:0;background:#111827aa;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.box{background:#fff;width:min(540px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:22px}.mh{display:flex;justify-content:space-between}.close{border:0;border-radius:50%;width:34px;height:34px}.form{display:grid;gap:12px}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}.form textarea{min-height:80px}.row{display:flex;justify-content:space-between;border:1px solid #ddd;border-radius:9px;padding:10px;margin:8px 0}.danger{border:0;background:#fee2e2;color:#b91c1c;padding:8px;border-radius:8px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery img{width:100%;border-radius:10px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){header{flex-wrap:wrap}.search{flex-basis:100%;order:3}.grid{grid-template-columns:1fr}}</style></head><body><header><div class="logo">🇮🇳 INDIA Play STORE</div><div class="search"><input id="search" placeholder="Search apps..."></div><button class="btn" onclick="openM('admin')">Admin</button></header><section class="hero"><div class="heroBox"><h1>Discover Apps You Love</h1><p>Browse apps and download your favorite apps easily.</p></div></section><main class="wrap"><div class="cats" id="cats"></div><h2>All Apps <small id="count" class="muted"></small></h2><div class="grid" id="grid"></div></main><div class="modal" id="download"><div class="box"><div class="mh"><h2>Download App</h2><button class="close" onclick="closeM('download')">×</button></div><p id="selected" class="muted"></p><form class="form" id="df"><input type="hidden" id="did"><label>Name<input id="dn" required></label><label>Mobile<input id="dm" required></label><label>Email<input id="de" type="email" required></label><button class="btn">Submit & Download</button></form></div></div><div class="modal" id="admin"><div class="box"><div class="mh"><h2>Admin Panel</h2><button class="close" onclick="closeM('admin')">×</button></div><div id="login"><form class="form" id="lf"><input id="user" placeholder="Username" required><input id="pass" type="password" placeholder="Password" required><button class="btn">Login</button></form></div><div id="panel" style="display:none"><form class="form" id="af"><input id="name" placeholder="App Name" required><input id="logo" type="file" accept="image/*" required><select id="category"><option>Tools</option><option>Education</option><option>Games</option><option>Business</option><option>Entertainment</option><option>Social</option></select><textarea id="desc" placeholder="Description" required></textarea><input id="version" value="1.0.0"><input id="size" value="25 MB"><input id="apk" type="file" accept=".apk" required><input id="images" type="file" accept="image/*" multiple><button class="btn">Add App</button></form><h3>Apps</h3><div id="adminList"></div></div></div></div><div class="modal" id="demo"><div class="box"><div class="mh"><h2 id="demoTitle">Demo</h2><button class="close" onclick="closeM('demo')">×</button></div><div class="gallery" id="gallery"></div></div></div><script>const seed=[{id:1,name:'Study Helper',icon:'📚',category:'Education',desc:'Notes and simple tools for students.',version:'1.0.0',size:'18 MB'},{id:2,name:'Quick Notes',icon:'📝',category:'Tools',desc:'Write and organize quick notes.',version:'2.1.0',size:'12 MB'},{id:3,name:'Game Zone',icon:'🎮',category:'Games',desc:'Lightweight games for everyone.',version:'1.4.2',size:'42 MB'}];let apps=JSON.parse(localStorage.getItem('ips_apps')||'null')||seed,active='All';const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem('ips_apps',JSON.stringify(apps))}function openM(x){$(x).classList.add('show')}function closeM(x){$(x).classList.remove('show')}function render(){let q=$('search').value.toLowerCase(),cats=['All',...new Set(apps.map(a=>a.category))],list=apps.filter(a=>(active==='All'||a.category===active)&&(a.name+' '+a.desc).toLowerCase().includes(q));$('cats').innerHTML=cats.map(c=>`<button class="cat ${c===active?'active':''}" onclick="active='${esc(c)}';render()">${esc(c)}</button>`).join('');$('count').textContent='('+list.length+' apps)';$('grid').innerHTML=list.length?list.map(a=>`<article class="card"><div class="head"><div class="icon">${a.logo?`<img src="${esc(a.logo)}">`:esc(a.icon||'📱')}</div><div><h3>${esc(a.name)}</h3><span class="muted">${esc(a.category)}</span></div></div><p class="desc">${esc(a.desc)}</p><div class="meta"><span>v${esc(a.version)}</span><span>${esc(a.size)}</span></div>${a.demo&&a.demo.length?`<button class="demo" onclick="showDemo(${a.id})">View Demo</button>`:''}<button class="download" onclick="startDownload(${a.id})">Download</button></article>`).join(''):'<div class="empty">No apps found.</div>'}function startDownload(id){let a=apps.find(x=>x.id===id);$('did').value=id;$('selected').textContent='Selected: '+a.name;openM('download')}$('df').onsubmit=e=>{e.preventDefault();let a=apps.find(x=>x.id==$('did').value),q=JSON.parse(localStorage.getItem('ips_enquiries')||'[]');q.unshift({app:a.name,name:$('dn').value,mobile:$('dm').value,email:$('de').value,at:new Date().toISOString()});localStorage.setItem('ips_enquiries',JSON.stringify(q));closeM('download');alert('Enquiry saved. APK download will be connected after a real APK URL is added.')};$('lf').onsubmit=e=>{e.preventDefault();if($('user').value==='9006277009'&&$('pass').value==='Lavk@23456'){$('login').style.display='none';$('panel').style.display='block';adminRender()}else alert('Invalid login')};$('af').onsubmit=e=>{e.preventDefault();let lf=$('logo').files[0],imgs=[...$('images').files],r=new FileReader;r.onload=()=>Promise.all(imgs.map(f=>new Promise(ok=>{let z=new FileReader;z.onload=()=>ok(z.result);z.readAsDataURL(f)}))).then(ds=>{let a={id:Date.now(),name:$('name').value,logo:r.result,category:$('category').value,desc:$('desc').value,version:$('version').value,size:$('size').value,icon:'📱',demo:ds};apps.unshift(a);save();render();adminRender();$('af').reset();alert('App added successfully')});r.readAsDataURL(lf)};function adminRender(){$('adminList').innerHTML=apps.map(a=>`<div class="row"><span><b>${esc(a.name)}</b><br><small>${esc(a.category)}</small></span><button class="danger" onclick="delApp(${a.id})">Delete</button></div>`).join('')}function delApp(id){apps=apps.filter(a=>a.id!==id);save();render();adminRender()}function showDemo(id){let a=apps.find(x=>x.id===id);$('demoTitle').textContent=a.name+' Demo';$('gallery').innerHTML=(a.demo||[]).map(x=>`<img src="${esc(x)}">`).join('')||'<div class="empty">No demo images.</div>';openM('demo')}$('search').oninput=render;render();</script></body></html>
