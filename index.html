<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INDIA Play STORE</title><link rel="stylesheet" href="style.css"></head><body><header><div class="logo">🇮🇳 INDIA Play STORE</div><div class="search"><input id="search" placeholder="Search apps..."></div><button class="btn" onclick="openM('admin')">Admin</button></header><section class="hero"><div class="heroBox"><h1>Discover Apps You Love</h1><p>Cloud-connected app marketplace — uploaded apps are visible on every browser/device.</p></div></section><main class="wrap"><div class="cats" id="cats"></div><h2>All Apps <small id="count" class="muted"></small></h2><div class="grid" id="grid"></div></main><div class="modal" id="download"><div class="box"><div class="mh"><h2>Download App</h2><button class="close" onclick="closeM('download')">×</button></div><p id="selected" class="muted"></p><form class="form" id="df"><input type="hidden" id="did"><label>Name<input id="dn" required></label><label>Mobile<input id="dm" required></label><label>Email<input id="de" type="email" required></label><button class="btn">Submit & Download</button></form></div></div><div class="modal" id="admin"><div class="box"><div class="mh"><h2>Admin Panel</h2><button class="close" onclick="closeM('admin')">×</button></div><div id="login"><form class="form" id="lf"><input id="user" placeholder="Username" required><input id="pass" type="password" placeholder="Password" required><button class="btn">Login</button></form></div><div id="panel" style="display:none"><p class="muted">Uploads अब cloud में save होंगे और सभी devices में दिखेंगे.</p><form class="form" id="af"><input id="name" placeholder="App Name" required><input id="logo" type="file" accept="image/*" required><select id="category"><option>Tools</option><option>Education</option><option>Games</option><option>Business</option><option>Entertainment</option><option>Social</option></select><textarea id="desc" placeholder="Description" required></textarea><input id="version" value="1.0.0"><input id="size" value="25 MB"><input id="apk" type="file" accept=".apk" required><input id="images" type="file" accept="image/*" multiple><button class="btn">Add App to Cloud</button></form><h3>Apps</h3><div id="adminList"></div></div></div></div><div class="modal" id="demo"><div class="box"><div class="mh"><h2 id="demoTitle">Demo</h2><button class="close" onclick="closeM('demo')">×</button></div><div class="gallery" id="gallery"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></body></html>
