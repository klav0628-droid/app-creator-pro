<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ease Bharat Connect — Find Local Services</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}header{background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;color:#123b72}.brand img{width:52px;height:52px;object-fit:contain}.admin{color:#123b72;text-decoration:none;font-weight:700}.hero{background:linear-gradient(125deg,#0d3568,#506b9a);color:#fff;text-align:center;padding:58px 18px 65px}.hero h1{font-size:42px;margin:0 0 12px}.hero h1 span{color:#ff7a22}.hero p{font-size:18px}.search{max-width:1000px;margin:28px auto 0;background:#fff;border-radius:12px;padding:7px;display:flex;gap:6px}.search input,.search select{flex:1;border:0;outline:0;padding:15px;font-size:15px}.search button{border:0;border-radius:9px;background:#ff5b16;color:#fff;padding:0 27px;font-weight:700;font-size:15px}.cats,.services{max-width:1150px;margin:30px auto;padding:0 18px}.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.cat{background:#fff;border:1px solid #e1e6ef;border-radius:12px;padding:18px 8px;text-align:center;font-weight:700;cursor:pointer}.services h2{margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e1e6ef;border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #0000000a}.media{width:100%;height:190px;object-fit:cover;background:#eef2f7}.body{padding:18px}.bizlogo{width:58px;height:58px;object-fit:contain;border-radius:10px;border:1px solid #eee;background:#fff;margin-top:-45px;position:relative}.verified{display:inline-block;background:#e9f8ee;color:#13733a;border-radius:20px;padding:5px 9px;font-size:12px;font-weight:700}.card h3{margin:9px 0 6px}.meta{color:#667085;font-size:14px;margin:5px 0}.desc{min-height:40px}.video{width:100%;max-height:250px;margin-top:10px;border-radius:8px}.actions{display:flex;gap:8px;margin-top:14px}.actions a{flex:1;text-align:center;padding:10px;border-radius:8px;text-decoration:none;border:1px solid #1262df;color:#1262df;font-weight:700}.actions a.call{background:#1262df;color:#fff}.empty{text-align:center;padding:35px;background:#fff;border-radius:12px}.loading{text-align:center;padding:25px}@media(max-width:900px){.cats{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.hero h1{font-size:30px}.search{flex-direction:column}.search button{padding:14px}.cats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html"><img src="logo.svg" alt="Ease Bharat Connect logo">Ease Bharat Connect</a><a class="admin" href="admin.html">Admin Login</a></header><section class="hero"><h1>Find Trusted Services <span>Near You</span></h1><p>Search, compare and connect with local businesses across India</p><div class="search"><input id="q" placeholder="Search service or business"><input id="city" placeholder="City / Location"><button onclick="loadServices()">Search</button></div></section><section class="cats"><div class="cat" onclick="setQ('Doctors')">🩺<br>Doctors</div><div class="cat" onclick="setQ('Home')">🏠<br>Home Services</div><div class="cat" onclick="setQ('Education')">🎓<br>Education</div><div class="cat" onclick="setQ('Restaurant')">🍽️<br>Restaurants</div><div class="cat" onclick="setQ('Repair')">🔧<br>Repair</div><div class="cat" onclick="setQ('Beauty')">💇<br>Beauty</div></section><section class="services"><h2>Featured & Local Services</h2><div id="cards" class="cards"><div class="loading">Services loading...</div></div></section><script>const API='https://pkofzvbdeljsksecbqzg.supabase.co/functions/v1/ease-api';const esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function setQ(x){document.getElementById('q').value=x;loadServices()}async function loadServices(){const q=document.getElementById('q').value.trim(),city=document.getElementById('city').value.trim();const box=document.getElementById('cards');box.innerHTML='<div class="loading">Services loading...</div>';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list',q,city})});const d=await r.json();if(!r.ok)throw Error(d.error||'Unable to load services');render(d.services||[])}catch(e){box.innerHTML='<div class="empty">Services अभी load नहीं हो पाईं। थोड़ी देर बाद refresh करें।</div>'}}function render(list){const box=document.getElementById('cards');if(!list.length){box.innerHTML='<div class="empty">कोई service नहीं मिली। Admin panel से service add करें।</div>';return}box.innerHTML=list.map(s=>{const logo=s.business_logo_url||'logo.svg',photo=s.service_photo_url;return `<article class="card">${photo?`<img class="media" src="${esc(photo)}" alt="${esc(s.name)}">`:'<div class="media"></div>'}<div class="body"><img class="bizlogo" src="${esc(logo)}" alt="Business logo"><div>${s.verified?'<span class="verified">✓ Verified</span>':''}</div><h3>${esc(s.name)}</h3><div class="meta">📍 ${esc(s.city||'India')}</div>${s.address?`<div class="meta">${esc(s.address)}</div>`:''}<p class="desc">${esc(s.description||'Trusted local service on Ease Bharat Connect.')}</p>${s.service_video_url?`<video class="video" controls preload="metadata"><source src="${esc(s.service_video_url)}"></video>`:''}<div class="actions">${s.phone?`<a class="call" href="tel:${esc(s.phone)}">📞 Call</a>`:''}${s.whatsapp?`<a href="https://wa.me/${esc(s.whatsapp.replace(/\D/g,''))}">WhatsApp</a>`:''}</div></div></article>`}).join('')}loadServices();</script></body></html>
