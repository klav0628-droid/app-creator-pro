<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ease Bharat Connect</title><style>body{margin:0;font-family:Arial;color:#172033;background:#fff}header{padding:10px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:5}.brand img{width:72px;height:72px;object-fit:contain}.hero{background:linear-gradient(120deg,#123b72,#4b638c);color:#fff;text-align:center;padding:80px 20px}.hero h1{font-size:42px;margin:0}.hero span{color:#ff6a12}.search{margin:30px auto 0;max-width:850px;display:flex;background:#fff;padding:6px;border-radius:12px}.search input{flex:1;padding:15px;border:0;outline:0}.search button{background:#ff5b16;color:#fff;border:0;border-radius:8px;padding:0 25px;font-weight:bold}.cats,.services{max-width:1100px;margin:35px auto;padding:0 20px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.cat,.card{padding:18px;border:1px solid #e1e6ef;border-radius:12px;background:#fff;box-shadow:0 3px 12px #0000000a}.cat{text-align:center}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.media{width:100%;height:180px;object-fit:cover;border-radius:9px;background:#eef2f7}.business-logo{width:72px;height:72px;object-fit:contain;border-radius:10px;border:1px solid #e5e7eb;background:#fff;margin-top:-36px;position:relative}.card h3{margin:8px 0}.tag{color:#168442}.verified{display:inline-block;background:#e7f7ed;color:#168442;padding:4px 8px;border-radius:12px;font-size:12px}.actions{display:flex;gap:8px;margin-top:15px}.actions a{flex:1;text-align:center;padding:9px;border:1px solid #1262df;border-radius:7px;text-decoration:none;color:#1262df}.empty{text-align:center;padding:30px;color:#64748b}@media(max-width:800px){.cats,.cards{grid-template-columns:repeat(2,1fr)}.search{flex-direction:column}.search button{padding:14px}.hero h1{font-size:30px}}@media(max-width:500px){.cats,.cards{grid-template-columns:1fr}}
</style></head><body><header><div class="brand"><img src="logo.svg" alt="Ease Bharat Connect logo"></div><a href="admin.html">Admin Login</a></header><section class="hero"><h1>Find Trusted Services <span>Near You</span></h1><p>Search • Compare • Connect</p><div class="search"><input id="q" placeholder="Search services or businesses..."><input id="city" placeholder="City / Location"><button onclick="loadServices()">🔍 Search</button></div></section><section class="cats"><div class="cat">🩺<br>Doctors</div><div class="cat">🏠<br>Home Services</div><div class="cat">🎓<br>Education</div><div class="cat">🍽️<br>Food & Restaurants</div></section><section class="services"><h2>Services Near You</h2><div class="cards" id="cards"><div class="empty">Loading services...</div></div></section><script>const API='https://pkofzvbdeljsksecbqzg.supabase.co/functions/v1/ease-api';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function card(s){const logo=s.business_logo_url?'<img class="business-logo" src="'+esc(s.business_logo_url)+'" alt="Business logo">':'';const photo=s.service_photo_url?'<img class="media" src="'+esc(s.service_photo_url)+'" alt="Service photo">':(s.business_logo_url?'<img class="media" src="'+esc(s.business_logo_url)+'" alt="Business">':'<div class="media"></div>');const video=s.service_video_url?'<video class="media" controls preload="metadata" src="'+esc(s.service_video_url)+'"></video>':'';const phone=s.phone?'<a href="tel:'+esc(s.phone)+'">📞 Call</a>':'';const wa=s.phone?'<a href="https://wa.me/'+esc(s.phone.replace(/[^0-9]/g,''))+'" target="_blank">WhatsApp</a>':'';return '<article class="card">'+photo+logo+(s.verified?'<div class="verified">✓ Verified</div>':'')+'<h3>'+esc(s.name)+'</h3><div class="tag">'+esc(s.city||'India')+'</div><p>'+esc(s.description||'Trusted local service.')+'</p>'+video+'<div class="actions">'+phone+wa+'</div></article>'}async function loadServices(){const q=encodeURIComponent(document.getElementById('q').value.trim()),city=encodeURIComponent(document.getElementById('city').value.trim());document.getElementById('cards').innerHTML='<div class="empty">Loading...</div>';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list',q:q?decodeURIComponent(q):'',city:city?decodeURIComponent(city):''})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to load services');const list=d.services||[];document.getElementById('cards').innerHTML=list.length?list.map(card).join(''):'<div class="empty">अभी कोई service नहीं मिली।</div>'}catch(e){document.getElementById('cards').innerHTML='<div class="empty">Services load नहीं हो सकीं। कृपया थोड़ी देर बाद refresh करें।</div>'}}loadServices();</script></body></html>
