<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hostel Booking</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:#fff;border-bottom:1px solid #e3e7ee;padding:14px 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}.brand{font-weight:800;font-size:20px}.btn{border:0;border-radius:9px;padding:11px 15px;background:#172033;color:#fff;font-weight:700;cursor:pointer}.btn.light{background:#e9eef5;color:#172033}.btn.green{background:#16803d}.btn.red{background:#b42318}.wrap{max-width:1120px;margin:auto;padding:20px}.hero{background:#172033;color:#fff;border-radius:18px;padding:26px;display:flex;gap:18px;align-items:center}.hero img{width:84px;height:84px;border-radius:15px;object-fit:cover;background:#fff}.grid{display:grid;grid-template-columns:1.35fr .9fr;gap:16px}.card{background:#fff;border:1px solid #e0e5ec;border-radius:15px;padding:20px;margin:16px 0;box-shadow:0 5px 18px #1720330b}.form{display:grid;gap:11px}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd3df;border-radius:9px;font:inherit;background:#fff}textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload{display:block;border:2px dashed #aeb8c7;border-radius:12px;padding:15px;font-weight:700}.upload input{margin-top:9px}.preview{width:180px;height:130px;object-fit:cover;border-radius:11px;margin-top:9px;background:#edf1f5}.service{display:grid;grid-template-columns:150px 1fr auto;gap:14px;border:1px solid #dfe4eb;border-radius:13px;padding:12px;margin:11px 0;align-items:center}.service img,.noimg{width:150px;height:110px;object-fit:cover;border-radius:10px}.noimg{background:#edf1f5;display:grid;place-items:center;color:#6b7280}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid #d8dee7;border-radius:9px;padding:9px 12px;background:#fff;font-weight:700;cursor:pointer}.tab.active{background:#172033;color:#fff}.booking{border:1px solid #dfe4eb;border-radius:12px;padding:14px;margin:10px 0;line-height:1.7}.badge{display:inline-block;border-radius:20px;padding:3px 9px;background:#e9eef5;font-size:12px;font-weight:700}.ok,.err{padding:10px;border-radius:9px;margin-top:10px}.ok{background:#e8f7ee;color:#146c3a}.err{background:#fff0f0;color:#a11}.hidden{display:none!important}.muted{color:#667085}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:50}.modalbox{background:#fff;border-radius:15px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}.service{grid-template-columns:90px 1fr}.service img,.service .noimg{width:90px;height:75px}.service .actions{grid-column:1/-1}.top{padding:12px}.brand{font-size:17px}.wrap{padding:12px}}</style></head><body><header class="top"><div class="brand">🏨 Hostel Booking</div><div><button class="btn light" onclick="goOwner()">Owner</button> <button class="btn" onclick="goCustomer()">Book Now</button> <button class="btn light" onclick="goAdmin()">Admin</button></div></header><main id="customer" class="wrap"><section class="hero"><img id="heroLogo" class="hidden"><div><small id="heroCat">HOTEL / HOSTEL</small><h1 id="heroName">Find & Book Your Stay</h1><p id="heroDesc">Rooms and services available for booking.</p></div></section><div class="grid"><section class="card"><h2>Rooms / Services</h2><div id="publicServices"></div></section><section class="card" id="bookCard"><h2>Book Now</h2><form id="bookingForm" class="form"><select id="bookingService" required><option value="">Select Room / Service</option></select><input id="customerName" placeholder="Customer Name" required><input id="customerPhone" placeholder="Mobile Number" required><input id="customerEmail" type="email" placeholder="Email"><div class="row"><input id="bookingDate" type="date" required><input id="bookingTime" type="time" required></div><button class="btn green">Confirm Booking</button></form><div id="bookingMsg"></div></section></div></main><main id="owner" class="wrap hidden"><div class="card"><button class="btn light" onclick="goCustomer()">← Customer Page</button><h2>Owner Dashboard</h2><div id="ownerAuth"><div class="form"><input id="ownerEmailLogin" type="email" placeholder="Owner Email"><input id="ownerPassword" type="password" placeholder="Password"><div class="actions"><button class="btn" onclick="ownerLogin()">Login</button><button class="btn light" onclick="ownerSignup()">Create Owner Account</button></div></div><div id="ownerAuthMsg"></div></div><div id="ownerDash" class="hidden"><div class="tabs"><button class="tab active" onclick="ownerTab('businessTab',this)">Business</button><button class="tab" onclick="ownerTab('serviceTab',this)">Rooms / Services</button><button class="tab" onclick="ownerTab('bookingTab',this)">Bookings</button><button class="tab light" onclick="ownerLogout()">Logout</button></div><section id="businessTab"><div class="card"><h3>Business Profile</h3><div class="form"><input id="bizName" placeholder="Business Name"><input id="bizCategory" placeholder="Business Category"><input id="ownerName" placeholder="Owner Name"><input id="ownerPhone" placeholder="Owner Mobile"><input id="ownerEmail" type="email" placeholder="Owner Email"><input id="ownerAddress" placeholder="Address"><textarea id="bizDescription" placeholder="Business Description"></textarea><label class="upload">🖼️ Business Logo Upload<input id="logoFile" type="file" accept="image/*"></label><img id="logoPreview" class="preview hidden"><button class="btn" onclick="saveBusiness()">Save Business</button></div><div id="bizMsg"></div><div id="bookingLink"></div></div></section><section id="serviceTab" class="hidden"><div class="card"><h3>➕ Add Room / Service</h3><div class="form"><input id="serviceName" placeholder="Room / Service Name"><textarea id="serviceDesc" placeholder="Description"></textarea><div class="row"><input id="servicePrice" type="number" min="0" placeholder="Price ₹"><input id="serviceDuration" type="number" min="1" value="60" placeholder="Duration minutes"></div><label class="upload">📷 Room / Service Photo Upload<br><span class="muted">Customer booking page पर photo दिखाई देगी</span><input id="servicePhoto" type="file" accept="image/*"></label><img id="servicePreview" class="preview hidden"><div class="actions"><button id="serviceSaveBtn" class="btn green" onclick="saveService()">➕ Add Room / Service + Photo</button><button id="serviceCancelBtn" class="btn light hidden" onclick="resetServiceForm()">Cancel Edit</button></div></div><div id="serviceMsg"></div></div><div class="card"><h3>My Rooms / Services</h3><div id="ownerServices"></div></div></section><section id="bookingTab" class="hidden"><div class="card"><h3>Customer Bookings</h3><div id="ownerBookings"></div></div></section></div></div></main><main id="admin" class="wrap hidden"><div class="card"><h2>Admin Panel</h2><div id="adminAuth"><div class="form"><input id="adminUser" value="9006977016" placeholder="Admin User ID"><input id="adminPassword" type="password" placeholder="Admin Password"><button class="btn" onclick="adminLogin()">Admin Login</button></div><div id="adminMsg"></div></div><div id="adminDash" class="hidden"><div class="card"><h3>All Owners / Businesses</h3><div id="adminOwners"></div></div><div class="card"><h3>All Customer Bookings</h3><div id="adminBookings"></div></div></div></div></main><div id="editModal" class="modal hidden"><div class="modalbox"><h3>Edit Booking</h3><div class="form"><input id="editCustomerName" placeholder="Customer Name"><input id="editCustomerPhone" placeholder="Mobile"><input id="editCustomerEmail" placeholder="Email"><input id="editDate" type="date"><input id="editTime" type="time"><select id="editStatus"><option>confirmed</option><option>pending</option><option>cancelled</option><option>completed</option></select><div class="actions"><button class="btn green" onclick="saveBookingEdit()">Save Changes</button><button class="btn light" onclick="closeModal()">Cancel</button></div></div></div></div><script>
const SUPABASE_URL='https://pkofzvbdeljsksecbqzg.supabase.co',SUPABASE_KEY='sb_publishable_oAYg9uDeIYVHQ829qTMTaQ_pXvhG2Kb',db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id),Q=new URLSearchParams(location.search);let user=null,biz=null,editingService=null,editingBooking=null,adminToken=null;
function safe(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function msg(id,t,ok=false){$(id).innerHTML='<div class="'+(ok?'ok':'err')+'">'+safe(t)+'</div>'}function goOwner(){location.href=location.pathname+'?owner=1'}function goCustomer(){location.href=location.pathname+(biz?.slug?'?business='+encodeURIComponent(biz.slug):'')}function goAdmin(){location.href=location.pathname+'?admin=1'}function ownerTab(id,el){['businessTab','serviceTab','bookingTab'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(id==='serviceTab')loadOwnerServices();if(id==='bookingTab')loadOwnerBookings()}
function imageData(file,max=1000,q=.72){return new Promise((resolve,reject)=>{if(!file)return resolve(null);let r=new FileReader;r.onload=()=>{let i=new Image;i.onload=()=>{let s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*s));c.height=Math.max(1,Math.round(i.height*s));c.getContext('2d').drawImage(i,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',q))};i.onerror=()=>reject(Error('Invalid image'));i.src=r.result};r.onerror=()=>reject(Error('Image read failed'));r.readAsDataURL(file)})}
$('logoFile').addEventListener('change',async e=>{if(e.target.files[0]){$('logoPreview').src=await imageData(e.target.files[0],700,.75);$('logoPreview').classList.remove('hidden')}});$('servicePhoto').addEventListener('change',async e=>{if(e.target.files[0]){$('servicePreview').src=await imageData(e.target.files[0]);$('servicePreview').classList.remove('hidden')}});
async function ownerSignup(){let email=$('ownerEmailLogin').value.trim(),password=$('ownerPassword').value;if(!email||password.length<6)return msg('ownerAuthMsg','Email और कम से कम 6 character password डालें।');let r=await db.auth.signUp({email,password});if(r.error)return msg('ownerAuthMsg',r.error.message);msg('ownerAuthMsg','Account बन गया। Email verification मांगा जाए तो verify करके Login करें।',true)}async function ownerLogin(){let r=await db.auth.signInWithPassword({email:$('ownerEmailLogin').value.trim(),password:$('ownerPassword').value});if(r.error)return msg('ownerAuthMsg',r.error.message);user=r.data.user;openOwnerDash()}async function ownerLogout(){await db.auth.signOut();location.href=location.pathname}
async function openOwnerDash(){$('customer').classList.add('hidden');$('owner').classList.remove('hidden');$('ownerAuth').classList.add('hidden');$('ownerDash').classList.remove('hidden');let r=await db.from('hotel_businesses').select('*').eq('owner_id',user.id).maybeSingle();if(r.error)return msg('bizMsg',r.error.message);biz=r.data;if(biz){fillBusiness();showBookingLink();loadOwnerServices();loadOwnerBookings()}else msg('bizMsg','पहले Business details भरकर Save Business करें।',true)}function fillBusiness(){let m={bizName:biz.name,bizCategory:biz.category,ownerName:biz.owner_name,ownerPhone:biz.owner_phone,ownerEmail:biz.owner_email||user.email,ownerAddress:biz.owner_address,bizDescription:biz.description};Object.keys(m).forEach(k=>$(k).value=m[k]||'');if(biz.logo_url){$('logoPreview').src=biz.logo_url;$('logoPreview').classList.remove('hidden')}}function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,45)+'-'+Math.random().toString(36).slice(2,7)}function showBookingLink(){if(!biz)return;$('bookingLink').innerHTML='<div class="ok"><b>Customer Booking Link</b><br><a target="_blank" href="'+location.origin+location.pathname+'?business='+encodeURIComponent(biz.slug)+'">Open Customer Booking Page</a></div>'}
async function saveBusiness(){let name=$('bizName').value.trim();if(!name)return msg('bizMsg','Business Name required');let logo=biz?.logo_url||null;try{if($('logoFile').files[0])logo=await imageData($('logoFile').files[0],700,.75)}catch(e){return msg('bizMsg',e.message)}let data={owner_id:user.id,name,category:$('bizCategory').value.trim()||'Hotel / Hostel',logo_url:logo,owner_name:$('ownerName').value.trim(),owner_phone:$('ownerPhone').value.trim(),owner_email:$('ownerEmail').value.trim()||user.email,owner_address:$('ownerAddress').value.trim(),description:$('bizDescription').value.trim()};let r=biz?await db.from('hotel_businesses').update(data).eq('id',biz.id).select().single():await db.from('hotel_businesses').insert({...data,slug:slugify(name)}).select().single();if(r.error)return msg('bizMsg',r.error.message);biz=r.data;msg('bizMsg','Business saved successfully.',true);showBookingLink()}
function resetServiceForm(){editingService=null;$('serviceName').value='';$('serviceDesc').value='';$('servicePrice').value='';$('serviceDuration').value=60;$('servicePhoto').value='';$('servicePreview').src='';$('servicePreview').classList.add('hidden');$('serviceSaveBtn').textContent='➕ Add Room / Service + Photo';$('serviceCancelBtn').classList.add('hidden')}async function saveService(){if(!biz)return msg('serviceMsg','पहले Business save करें।');let name=$('serviceName').value.trim();if(!name)return msg('serviceMsg','Room / Service Name required');let data={name,description:$('serviceDesc').value.trim()||null,price:Number($('servicePrice').value||0),duration_minutes:Number($('serviceDuration').value||60),active:true};try{if($('servicePhoto').files[0])data.photo_url=await imageData($('servicePhoto').files[0]);else if(editingService)data.photo_url=editingService.photo_url||null}catch(e){return msg('serviceMsg',e.message)}let r=editingService?await db.from('hotel_services').update(data).eq('id',editingService.id).eq('business_id',biz.id):await db.from('hotel_services').insert({...data,business_id:biz.id});if(r.error)return msg('serviceMsg',r.error.message);msg('serviceMsg',editingService?'Room / Service updated.':'Room / Service added with photo.',true);resetServiceForm();loadOwnerServices()}
async function loadOwnerServices(){if(!biz)return;let r=await db.from('hotel_services').select('*').eq('business_id',biz.id).order('created_at',{ascending:false});if(r.error)return msg('serviceMsg',r.error.message);$('ownerServices').innerHTML=(r.data||[]).map(x=>'<div class="service">'+(x.photo_url?'<img src="'+x.photo_url+'">':'<div class="noimg">No Photo</div>')+'<div><h3>'+safe(x.name)+'</h3><div class="muted">'+safe(x.description||'')+'</div><b>₹'+Number(x.price||0).toLocaleString('en-IN')+'</b> · '+safe(x.duration_minutes)+' min<div class="actions"><button class="btn light" onclick="editService(\''+x.id+'\')">✏️ Edit</button><button class="btn red" onclick="deleteService(\''+x.id+'\')">🗑️ Delete</button></div></div></div>').join('')||'<p class="muted">अभी कोई Room / Service नहीं है। ऊपर से Add करें।</p>'}async function editService(id){let r=await db.from('hotel_services').select('*').eq('id',id).single();if(r.error)return msg('serviceMsg',r.error.message);editingService=r.data;$('serviceName').value=r.data.name||'';$('serviceDesc').value=r.data.description||'';$('servicePrice').value=r.data.price||0;$('serviceDuration').value=r.data.duration_minutes||60;if(r.data.photo_url){$('servicePreview').src=r.data.photo_url;$('servicePreview').classList.remove('hidden')}else $('servicePreview').classList.add('hidden');$('serviceSaveBtn').textContent='💾 Update Room / Service';$('serviceCancelBtn').classList.remove('hidden');$('serviceTab').scrollIntoView({behavior:'smooth'})}async function deleteService(id){if(!confirm('इस Room / Service को delete करें?'))return;let r=await db.from('hotel_services').delete().eq('id',id).eq('business_id',biz.id);if(r.error)return msg('serviceMsg',r.error.message);msg('serviceMsg','Room / Service deleted.',true);loadOwnerServices()}
async function loadOwnerBookings(){if(!biz)return;let r=await db.from('hotel_bookings').select('*,hotel_services(name,price)').eq('business_id',biz.id).order('created_at',{ascending:false});if(r.error)return msg('bookingTab',r.error.message);$('ownerBookings').innerHTML=(r.data||[]).map(x=>{let s=x.hotel_services||{};return '<div class="booking"><b>'+safe(x.customer_name)+'</b><br>📱 '+safe(x.customer_phone)+' · ✉️ '+safe(x.customer_email||'-')+'<br>🏨 '+safe(s.name||'-')+' · ₹'+Number(s.price||0).toLocaleString('en-IN')+'<br>📅 '+safe(x.booking_date)+' ⏰ '+safe(String(x.booking_time||'').slice(0,5))+'<br><span class="badge">'+safe(x.status)+'</span> · ID: '+safe(x.id)+'<div class="actions"><button class="btn light" onclick="openBookingEdit(\''+x.id+'\')">✏️ Edit Full Details</button></div></div>'}).join('')||'<p class="muted">अभी कोई booking नहीं है।</p>'}
async function openBookingEdit(id){let r=await db.from('hotel_bookings').select('*').eq('id',id).single();if(r.error)return alert(r.error.message);editingBooking=r.data;$('editCustomerName').value=r.data.customer_name||'';$('editCustomerPhone').value=r.data.customer_phone||'';$('editCustomerEmail').value=r.data.customer_email||'';$('editDate').value=r.data.booking_date||'';$('editTime').value=String(r.data.booking_time||'').slice(0,5);$('editStatus').value=r.data.status||'confirmed';$('editModal').classList.remove('hidden')}function closeModal(){$('editModal').classList.add('hidden');editingBooking=null}async function saveBookingEdit(){if(!editingBooking)return;let r=await db.from('hotel_bookings').update({customer_name:$('editCustomerName').value.trim(),customer_phone:$('editCustomerPhone').value.trim(),customer_email:$('editCustomerEmail').value.trim()||null,booking_date:$('editDate').value,booking_time:$('editTime').value,status:$('editStatus').value}).eq('id',editingBooking.id);if(r.error)return alert(r.error.message);closeModal();loadOwnerBookings()}
async function loadPublic(){let slug=Q.get('business');if(!slug){$('publicServices').innerHTML='<p class="muted">Owner का Customer Booking Link खोलें।</p>';return}let r=await db.from('hotel_businesses').select('*').eq('slug',slug).maybeSingle();if(r.error)return msg('publicServices',r.error.message);biz=r.data;if(!biz)return msg('publicServices','Business not found');$('heroName').textContent=biz.name;$('heroCat').textContent=(biz.category||'HOTEL / HOSTEL').toUpperCase();$('heroDesc').textContent=biz.description||'Rooms and services available for booking.';if(biz.logo_url){$('heroLogo').src=biz.logo_url;$('heroLogo').classList.remove('hidden')}let s=await db.from('hotel_services').select('*').eq('business_id',biz.id).eq('active',true).order('created_at',{ascending:false});if(s.error)return msg('publicServices',s.error.message);let rows=s.data||[];$('publicServices').innerHTML=rows.map(x=>'<div class="service">'+(x.photo_url?'<img src="'+x.photo_url+'">':'<div class="noimg">No Photo</div>')+'<div><h3>'+safe(x.name)+'</h3><div class="muted">'+safe(x.description||'')+'</div><b>₹'+Number(x.price||0).toLocaleString('en-IN')+'</b> · '+safe(x.duration_minutes)+' min</div><button class="btn green" onclick="selectService(\''+x.id+'\')">Book Now</button></div>').join('')||'<p class="muted">No rooms/services available.</p>';$('bookingService').innerHTML='<option value="">Select Room / Service</option>'+rows.map(x=>'<option value="'+x.id+'">'+safe(x.name)+' — ₹'+Number(x.price||0).toLocaleString('en-IN')+'</option>').join('')}function selectService(id){$('bookingService').value=id;$('bookCard').scrollIntoView({behavior:'smooth'})}$('bookingForm').addEventListener('submit',async e=>{e.preventDefault();if(!biz)return msg('bookingMsg','Invalid booking link');let r=await db.from('hotel_bookings').insert({business_id:biz.id,service_id:$('bookingService').value,customer_name:$('customerName').value.trim(),customer_phone:$('customerPhone').value.trim(),customer_email:$('customerEmail').value.trim()||null,booking_date:$('bookingDate').value,booking_time:$('bookingTime').value,status:'confirmed'});if(r.error)return msg('bookingMsg',r.error.message);msg('bookingMsg','Booking confirmed successfully.',true);e.target.reset()});
async function adminLogin(){let r=await db.rpc('admin_login',{p_username:$('adminUser').value.trim(),p_password:$('adminPassword').value});if(r.error)return msg('adminMsg',r.error.message);if(!r.data?.ok)return msg('adminMsg',r.data?.message||'Invalid Admin Login');adminToken=r.data.token;$('adminAuth').classList.add('hidden');$('adminDash').classList.remove('hidden');loadAdmin()}async function loadAdmin(){let r=await db.rpc('admin_overview',{p_token:adminToken});if(r.error)return msg('adminMsg',r.error.message);let d=r.data||{};$('adminOwners').innerHTML=(d.owners||[]).map(x=>'<div class="booking"><b>'+safe(x.name)+'</b> · '+safe(x.category)+'<br>Owner: '+safe(x.owner_name||'-')+' · '+safe(x.owner_phone||'-')+'<br>Email: '+safe(x.owner_email||x.auth_email||'-')+'<br>Address: '+safe(x.owner_address||'-')+'<br>Services: '+safe(x.service_count)+' · Bookings: '+safe(x.booking_count)+'</div>').join('')||'No owners';$('adminBookings').innerHTML=(d.bookings||[]).map(x=>'<div class="booking"><b>'+safe(x.business_name)+'</b><br>Customer: '+safe(x.customer_name)+' · '+safe(x.customer_phone)+' · '+safe(x.customer_email||'-')+'<br>Service: '+safe(x.service_name||'-')+' · ₹'+Number(x.price||0).toLocaleString('en-IN')+'<br>'+safe(x.booking_date)+' '+safe(String(x.booking_time||'').slice(0,5))+' · '+safe(x.status)+'<br>ID: '+safe(x.id)+'</div>').join('')||'No bookings'}async function boot(){if(Q.get('admin')==='1'){customer.classList.add('hidden');admin.classList.remove('hidden');return}if(Q.get('owner')==='1'){customer.classList.add('hidden');owner.classList.remove('hidden');let s=await db.auth.getSession();if(s.data.session){user=s.data.session.user;await openOwnerDash()}return}await loadPublic()}boot();
</script></body></html>
