<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hostel Booking</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font:15px Arial;background:#f5f7fb;color:#172033}.nav{padding:14px 5%;background:#fff;display:flex;justify-content:space-between;position:sticky;top:0;border-bottom:1px solid #ddd}.wrap{max-width:1050px;margin:auto;padding:20px}.btn{border:0;border-radius:9px;padding:10px 15px;background:#172033;color:#fff;font-weight:bold;cursor:pointer}.green{background:#16803d}.red{background:#b42318}.light{background:#edf1f6;color:#172033}.card{background:#fff;border:1px solid #ddd;border-radius:15px;padding:20px;margin:15px 0}.hero{background:#172033;color:#fff;border-radius:16px;padding:25px;display:flex;gap:18px;align-items:center}.hero img{width:80px;height:80px;object-fit:cover;border-radius:14px;background:#fff}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:15px}.form{display:grid;gap:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd2dc;border-radius:8px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload{border:2px dashed #aeb7c5;border-radius:12px;padding:15px}.upload input{margin-top:8px}.service,.booking{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0}.service{display:flex;gap:12px}.service img,.thumb{width:150px;height:110px;object-fit:cover;border-radius:10px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.tab{padding:9px 12px;border:1px solid #ddd;border-radius:8px;background:#fff;font-weight:bold}.active{background:#172033;color:#fff}.hidden{display:none}.ok,.err{padding:10px;border-radius:8px;margin-top:10px}.ok{background:#e9f8ef}.err{background:#fff0f0;color:#a11}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}.service{display:block}.service img{width:100%;height:210px}}</style></head><body><nav class="nav"><b id="brand">Hostel & Hotel Booking</b><span><button class="btn light" onclick="goOwner()">Owner</button> <button class="btn" onclick="$('book').scrollIntoView()">Book Now</button></span></nav><main id="public" class="wrap"><section class="hero"><img id="heroLogo" class="hidden"><div><small id="cat">HOTEL / HOSTEL</small><h1 id="title">Your Hostel / Hotel</h1><p id="desc">Book rooms and services directly.</p></div></section><div class="grid"><section class="card"><h2>Rooms / Services</h2><div id="services">Open a business booking link.</div></section><section id="book" class="card"><h2>Book Now</h2><form id="bookingForm" class="form"><select id="service" required><option value="">Select room / service</option></select><input id="cn" placeholder="Customer name" required><input id="cp" placeholder="Mobile number" required><input id="ce" type="email" placeholder="Email"><div class="row"><input id="date" type="date" required><input id="time" type="time" required></div><button class="btn green">Confirm Booking</button></form><div id="bm"></div></section></div></main><main id="owner" class="wrap hidden"><div class="card"><button class="btn light" onclick="location.href=location.pathname">Customer Page</button><h2>Owner Dashboard</h2><div id="auth"><div class="form"><input id="oe" type="email" placeholder="Owner email"><input id="op" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><button class="btn light" onclick="signup()">Create Owner Account</button></div><div id="authMsg"></div></div><div id="dash" class="hidden"><div class="tabs"><button class="tab active" onclick="tab('business',this)">Business</button><button class="tab" onclick="tab('servicesTab',this)">Rooms / Services</button><button class="tab" onclick="tab('bookingsTab',this)">Bookings</button><button class="tab" onclick="logout()">Logout</button></div><section id="business"><div class="form"><input id="bn" placeholder="Business Name"><input id="bc" placeholder="Business Category"><input id="on" placeholder="Owner Name"><input id="phone" placeholder="Owner Mobile"><input id="email" type="email" placeholder="Owner Email"><textarea id="address" placeholder="Address"></textarea><textarea id="description" placeholder="Business Description"></textarea><label class="upload"><b>🖼️ Business Logo Upload</b><input id="logoFile" type="file" accept="image/*"></label><img id="logoPreview" class="thumb hidden"><button class="btn" onclick="saveBusiness()">Save Business</button></div><div id="bizMsg"></div><div id="link"></div></section><section id="servicesTab" class="hidden"><h3>➕ Add Room / Service</h3><div class="form"><input id="sn" placeholder="Room / Service Name"><input id="sd" placeholder="Description"><div class="row"><input id="price" type="number" min="0" placeholder="Price ₹"><input id="duration" type="number" min="1" value="60" placeholder="Duration minutes"></div><label class="upload"><b>📷 Room / Service Photo Upload</b><br>Photo customer ko dikhegi<input id="servicePhoto" type="file" accept="image/*"></label><img id="servicePreview" class="thumb hidden"><div class="actions"><button id="saveSvc" class="btn green" onclick="saveService()">➕ Add Room / Service + Photo</button><button id="cancelSvc" class="btn light hidden" onclick="resetSvc()">Cancel Edit</button></div></div><div id="svcMsg"></div><h3>My Rooms / Services</h3><div id="myServices"></div></section><section id="bookingsTab" class="hidden"><h3>Customer Bookings</h3><div id="myBookings"></div></section></div></div></main><main id="admin" class="wrap hidden"><div class="card"><h2>Admin Panel</h2><div class="form"><input id="adminUser" placeholder="Admin User ID"><input id="adminPass" type="password" placeholder="Admin Password"><button class="btn" onclick="adminLogin()">Admin Login</button></div><div id="adminMsg"></div><div id="adminData"></div></div></main><script>const db=supabase.createClient('https://pkofzvbdeljsksecbqzg.supabase.co','sb_publishable_oAYg9uDeIYVHQ829qTMTaQ_pXvhG2Kb'),$=id=>document.getElementById(id),Q=new URLSearchParams(location.search);let user=null,biz=null,editServiceId=null;function msg(id,t,ok=false){$(id).innerHTML='<div class="'+(ok?'ok':'err')+'">'+String(t).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>'}function goOwner(){location.href=location.pathname+'?owner=1'}function tab(id,e){['business','servicesTab','bookingsTab'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));e.classList.add('active')}function imageData(f,max=1200,q=.72){return new Promise((res,rej)=>{if(!f)return res(null);let r=new FileReader;r.onload=()=>{let i=new Image;i.onload=()=>{let s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.src=r.result};r.onerror=()=>rej(Error('Image read failed'));r.readAsDataURL(f)})}async function loadPublic(){let slug=Q.get('business');if(!slug)return;let r=await db.from('hotel_businesses').select('*').eq('slug',slug).maybeSingle();if(r.error)return msg('services',r.error.message);biz=r.data;if(!biz)return msg('services','Business not found');$('brand').textContent=biz.name;$('title').textContent=biz.name;$('cat').textContent=(biz.category||'HOTEL / HOSTEL').toUpperCase();$('desc').textContent=biz.description||'Book rooms and services directly.';if(biz.logo_url){$('heroLogo').src=biz.logo_url;$('heroLogo').classList.remove('hidden')}let s=await db.from('hotel_services').select('*').eq('business_id',biz.id).eq('active',true).order('created_at');let rows=s.data||[];$('services').innerHTML=rows.map(x=>'<div class="service">'+(x.photo_url?'<img src="'+x.photo_url+'">':'<div style="width:150px;height:110px;background:#eef1f5;display:grid;place-items:center">No Photo</div>')+'<div><b>'+x.name+'</b><p>'+String(x.description||'')+'</p><b>₹'+Number(x.price).toLocaleString('en-IN')+'</b></div></div>').join('')||'No services available';$('service').innerHTML='<option value="">Select room / service</option>'+rows.map(x=>'<option value="'+x.id+'">'+x.name+' — ₹'+Number(x.price).toLocaleString('en-IN')+'</option>').join('')}async function signup(){let e=$('oe').value.trim(),p=$('op').value;if(!e||p.length<6)return msg('authMsg','Email aur minimum 6 character password dein.');let r=await db.auth.signUp({email:e,password:p});msg('authMsg',r.error?.message||'Account created. Email verify karke login karein.',!r.error)}async function login(){let r=await db.auth.signInWithPassword({email:$('oe').value.trim(),password:$('op').value});if(r.error)return msg('authMsg',r.error.message);user=r.data.user;openDash()}async function openDash(){$('public').classList.add('hidden');$('owner').classList.remove('hidden');$('auth').classList.add('hidden');$('dash').classList.remove('hidden');let r=await db.from('hotel_businesses').select('*').eq('owner_id',user.id).limit(1).maybeSingle();biz=r.data;if(!biz)return;for(let [id,key] of [['bn','name'],['bc','category'],['on','owner_name'],['phone','owner_phone'],['email','owner_email'],['address','owner_address'],['description','description']])$(id).value=biz[key]||'';if(biz.logo_url){$('logoPreview').src=biz.logo_url;$('logoPreview').classList.remove('hidden')}showLink();listServices();listBookings()}function showLink(){$('link').innerHTML='<div class="ok"><b>Customer Booking Link:</b><br>'+location.origin+location.pathname+'?business='+encodeURIComponent(biz.slug)+'</div>'}async function saveBusiness(){let name=$('bn').value.trim();if(!name)return msg('bizMsg','Business Name required');let logo=biz?.logo_url||null;try{if($('logoFile').files[0])logo=await imageData($('logoFile').files[0],800,.75)}catch(e){return msg('bizMsg',e.message)}let d={owner_id:user.id,name,category:$('bc').value.trim()||'Hotel / Hostel',logo_url:logo,owner_name:$('on').value.trim(),owner_phone:$('phone').value.trim(),owner_email:$('email').value.trim(),owner_address:$('address').value.trim(),description:$('description').value.trim()};let r=biz?await db.from('hotel_businesses').update(d).eq('id',biz.id).select().single():await db.from('hotel_businesses').insert({...d,slug:name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Math.random().toString(36).slice(2,7)}).select().single();if(r.error)return msg('bizMsg',r.error.message);biz=r.data;msg('bizMsg','Business saved',true);showLink()}function resetSvc(){$('sn').value='';$('sd').value='';$('price').value='';$('duration').value=60;$('servicePhoto').value='';$('servicePreview').src='';$('servicePreview').classList.add('hidden');editServiceId=null;$('saveSvc').textContent='➕ Add Room / Service + Photo';$('cancelSvc').classList.add('hidden')}async function saveService(){if(!biz)return msg('svcMsg','Pehle Business save karein');let name=$('sn').value.trim();if(!name)return msg('svcMsg','Room / Service name required');let d={name,description:$('sd').value.trim()||null,price:Number($('price').value||0),duration_minutes:Number($('duration').value||60),active:true};try{if($('servicePhoto').files[0])d.photo_url=await imageData($('servicePhoto').files[0])}catch(e){return msg('svcMsg',e.message)}let r=editServiceId?await db.from('hotel_services').update(d).eq('id',editServiceId).eq('business_id',biz.id):await db.from('hotel_services').insert({...d,business_id:biz.id});if(r.error)return msg('svcMsg',r.error.message);msg('svcMsg',editServiceId?'Room / Service updated':'Room / Service added with photo',true);resetSvc();listServices()}async function listServices(){let r=await db.from('hotel_services').select('*').eq('business_id',biz.id).order('created_at',{ascending:false});$('myServices').innerHTML=(r.data||[]).map(x=>'<div class="service">'+(x.photo_url?'<img src="'+x.photo_url+'">':'<div style="width:150px;height:110px;background:#eef1f5;display:grid;place-items:center">No Photo</div>')+'<div style="flex:1"><b>'+x.name+'</b><p>'+String(x.description||'')+'</p><b>₹'+Number(x.price).toLocaleString('en-IN')+'</b><div class="actions"><button class="btn light" onclick=\'editService('+JSON.stringify(x)+')\'>✏️ Edit</button><button class="btn red" onclick="deleteService(\''+x.id+'\')">🗑️ Delete</button></div></div></div>').join('')||'No services'}function editService(x){editServiceId=x.id;$('sn').value=x.name||'';$('sd').value=x.description||'';$('price').value=x.price??'';$('duration').value=x.duration_minutes||60;$('servicePreview').src=x.photo_url||'';$('servicePreview').classList.toggle('hidden',!x.photo_url);$('saveSvc').textContent='💾 Update Room / Service';$('cancelSvc').classList.remove('hidden')}async function deleteService(id){if(!confirm('Delete this Room / Service?'))return;let r=await db.from('hotel_services').delete().eq('id',id).eq('business_id',biz.id);if(r.error)return msg('svcMsg',r.error.message);msg('svcMsg','Deleted',true);listServices()}async function listBookings(){let r=await db.from('hotel_bookings').select('*,hotel_services(name,price)').eq('business_id',biz.id).order('created_at',{ascending:false});$('myBookings').innerHTML=(r.data||[]).map(x=>'<div class="booking"><b>'+x.customer_name+'</b><div>Mobile: '+x.customer_phone+' | Email: '+(x.customer_email||'-')+'</div><div>Service: '+(x.hotel_services?.name||'-')+' | ₹'+Number(x.hotel_services?.price||0)+'</div><div>'+x.booking_date+' '+String(x.booking_time).slice(0,5)+' | <b>'+x.status+'</b></div></div>').join('')||'No bookings yet'}$('bookingForm').onsubmit=async e=>{e.preventDefault();if(!biz)return msg('bm','Invalid booking page');let r=await db.from('hotel_bookings').insert({business_id:biz.id,service_id:$('service').value,customer_name:$('cn').value.trim(),customer_phone:$('cp').value.trim(),customer_email:$('ce').value.trim()||null,booking_date:$('date').value,booking_time:$('time').value,status:'confirmed'});if(r.error)return msg('bm',r.error.message);msg('bm','Booking confirmed successfully',true);e.target.reset()};$('servicePhoto').onchange=e=>{if(e.target.files[0]){$('servicePreview').src=URL.createObjectURL(e.target.files[0]);$('servicePreview').classList.remove('hidden')}};async function adminLogin(){let r=await db.rpc('admin_login',{p_username:$('adminUser').value.trim(),p_password:$('adminPass').value});if(r.error)return msg('adminMsg',r.error.message);if(!r.data?.ok)return msg('adminMsg','Invalid login');sessionStorage.setItem('adminToken',r.data.token);msg('adminMsg','Admin login successful',true)}async function init(){if(Q.get('admin')){$('public').classList.add('hidden');$('admin').classList.remove('hidden');return}if(Q.get('owner')){let s=await db.auth.getSession();if(s.data.session){user=s.data.session.user;openDash()}else{$('public').classList.add('hidden');$('owner').classList.remove('hidden')}return}loadPublic()}init();</script></body></html>
