<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel Booking Page</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#172033}.nav{background:#fff;border-bottom:1px solid #e8ebf0;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:3}.brand{font-weight:800;font-size:20px}.btn{border:0;border-radius:10px;padding:11px 16px;background:#172033;color:#fff;cursor:pointer;font-weight:700}.btn.light{background:#eef1f6;color:#172033}.hero{max-width:1100px;margin:28px auto;padding:34px;border-radius:24px;background:linear-gradient(135deg,#162033,#334d72);color:#fff}.hero h1{font-size:42px;margin:10px 0}.hero p{opacity:.85}.grid{max-width:1100px;margin:0 auto 50px;display:grid;grid-template-columns:1.4fr .8fr;gap:22px}.card{background:#fff;border:1px solid #e8ebf0;border-radius:18px;padding:22px;box-shadow:0 8px 30px #1620330b}.service{display:flex;justify-content:space-between;gap:15px;border:1px solid #edf0f4;border-radius:14px;padding:16px;margin:12px 0}.price{font-weight:800}.form{display:grid;gap:12px}input,select{width:100%;padding:12px;border:1px solid #dce1e8;border-radius:10px;font:inherit}.owner{max-width:1100px;margin:20px auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{margin:15px}.hero h1{font-size:32px}.row{grid-template-columns:1fr}}.muted{color:#667085;font-size:14px}.logo{width:52px;height:52px;border-radius:14px;object-fit:cover;background:#fff}.hidden{display:none}.success{padding:14px;background:#e9f8ef;color:#17643a;border-radius:10px}</style></head><body><nav class="nav"><div class="brand" id="navBrand">Hotel Booking</div><button class="btn light" onclick="showOwner()">Owner Panel</button></nav><section class="hero"><img id="logo" class="logo hidden"><div class="muted" id="cat" style="color:#d9e5f5">HOTEL</div><h1 id="bizName">Your Hotel</h1><p id="tagline">Book your stay or service directly.</p></section><main class="grid"><section class="card"><h2>Services</h2><div id="services"><p class="muted">Loading services...</p></div></section><section class="card"><h2>Book Now</h2><form id="booking" class="form"><select id="service" required></select><input id="name" placeholder="Customer name" required><input id="phone" placeholder="Mobile number" required><input id="email" type="email" placeholder="Email (optional)"><div class="row"><input id="date" type="date" required><input id="time" type="time" required></div><button class="btn">Confirm Booking</button></form><div id="msg"></div></section></main><section id="owner" class="owner hidden"><div class="card"><h2>Owner Setup</h2><p class="muted">Owner account login is required for production. This demo uses your browser session for the setup form.</p><div class="form"><input id="ownerName" placeholder="Business name e.g. Royal Stay Hotel"><input id="ownerCat" placeholder="Business category e.g. Hotel / Hostel / Resort"><input id="ownerLogo" placeholder="Logo image URL (optional)"><button class="btn" onclick="saveBusiness()">Save Business</button></div><hr><h3>Add Service</h3><div class="form"><input id="svcName" placeholder="Service name e.g. Deluxe Room"><input id="svcDesc" placeholder="Short description"><div class="row"><input id="svcPrice" type="number" placeholder="Price"><input id="svcDuration" type="number" value="60" placeholder="Duration minutes"></div><button class="btn" onclick="addService()">Add Service</button></div><div id="ownerMsg"></div></div></section><script>const SUPA_URL='https://pkofzvbdeljsksecbqzg.supabase.co';const SUPA_KEY='sb_publishable_oAYg9uDeIYVHQ829qTMTaQ_pXvhG2Kb';const db=supabase.createClient(SUPA_URL,SUPA_KEY);let business=null,services=[];const slug=new URLSearchParams(location.search).get('business')||'demo-hotel';async function load(){let {data:b}=await db.from('hotel_businesses').select('*').eq('slug',slug).maybeSingle();business=b;if(!business){document.getElementById('bizName').textContent='Demo Hotel';services=[{id:'demo',name:'Deluxe Room',description:'Comfortable room with breakfast',price:1999,duration_minutes:1440}];render();return}document.getElementById('bizName').textContent=business.name;document.getElementById('navBrand').textContent=business.name;document.getElementById('cat').textContent=business.category.toUpperCase();if(business.logo_url){logo.src=business.logo_url;logo.classList.remove('hidden')}let r=await db.from('hotel_services').select('*').eq('business_id',business.id).eq('active',true).order('created_at');services=r.data||[];render()}function render(){servicesEl=document.getElementById('services');serviceEl=document.getElementById('service');servicesEl.innerHTML=services.map(s=>`<div class="service"><div><b>${s.name}</b><div class="muted">${s.description||''}</div></div><div class="price">₹${Number(s.price).toLocaleString('en-IN')}</div></div>`).join('')||'<p class="muted">No services added yet.</p>';serviceEl.innerHTML=services.map(s=>`<option value="${s.id}">${s.name} — ₹${Number(s.price).toLocaleString('en-IN')}</option>`).join('')}function showOwner(){document.getElementById('owner').classList.toggle('hidden')}async function saveBusiness(){let {data:{user}}=await db.auth.getUser();if(!user){ownerMsg.innerHTML='<div class="success">Please add Supabase email login for owners before saving. Customer booking is already public.</div>';return}let name=ownerName.value.trim(),cat=ownerCat.value.trim()||'Hotel',logoUrl=ownerLogo.value.trim(),newSlug=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+Math.random().toString(36).slice(2,7);let r=await db.from('hotel_businesses').insert({owner_id:user.id,name,category:cat,logo_url:logoUrl||null,slug:newSlug}).select().single();ownerMsg.innerHTML=r.error?`<div>${r.error.message}</div>`:`<div class="success">Business saved. Booking link: ?business=${r.data.slug}</div>`}async function addService(){if(!business){ownerMsg.textContent='Save your business first.';return}let r=await db.from('hotel_services').insert({business_id:business.id,name:svcName.value,description:svcDesc.value,price:Number(svcPrice.value||0),duration_minutes:Number(svcDuration.value||60)});ownerMsg.innerHTML=r.error?`<div>${r.error.message}</div>`:'<div class="success">Service added.</div>';load()}document.getElementById('booking').addEventListener('submit',async e=>{e.preventDefault();if(!business){msg.innerHTML='<div class="success">Demo mode: connect an owner business to receive live bookings.</div>';return}let r=await db.from('hotel_bookings').insert({business_id:business.id,service_id:service.value,customer_name:name.value,customer_phone:phone.value,customer_email:email.value||null,booking_date:date.value,booking_time:time.value});msg.innerHTML=r.error?`<div>${r.error.message}</div>`:'<div class="success">Booking confirmed. Thank you!</div>';if(!r.error)e.target.reset()});load();</script></body></html>
