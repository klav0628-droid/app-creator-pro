<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StayBook — Hotel & Hostel Booking</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#172033}.nav{height:68px;background:#fff;border-bottom:1px solid #e7eaf0;padding:0 5%;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}.brand{font-weight:900;font-size:21px}.navlinks{display:flex;gap:8px}.btn{border:0;border-radius:11px;padding:11px 16px;background:#172033;color:#fff;cursor:pointer;font-weight:800}.btn.light{background:#eef1f6;color:#172033}.btn.green{background:#15803d}.wrap{max-width:1120px;margin:auto;padding:22px}.hero{margin:18px auto;padding:34px;border-radius:25px;background:linear-gradient(135deg,#172033,#41698f);color:white;display:flex;gap:22px;align-items:center}.hero img{width:76px;height:76px;border-radius:18px;object-fit:cover;background:#fff}.hero h1{font-size:40px;margin:4px 0}.hero p{margin:4px 0;color:#dce8f3}.badge{font-size:12px;font-weight:800;letter-spacing:.08em;color:#d9e8f6}.grid{display:grid;grid-template-columns:1.35fr .8fr;gap:20px}.card{background:#fff;border:1px solid #e7eaf0;border-radius:18px;padding:22px;box-shadow:0 8px 30px #1720330b}.service{display:flex;justify-content:space-between;gap:15px;border:1px solid #edf0f4;border-radius:14px;padding:16px;margin:12px 0}.price{font-weight:900;white-space:nowrap}.muted{color:#667085;font-size:14px}.form{display:grid;gap:11px}input,select{width:100%;padding:12px;border:1px solid #d9dee8;border-radius:10px;font:inherit;background:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.owner{margin-top:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px}.tab{border:1px solid #dce1e8;background:#fff;padding:9px 13px;border-radius:10px;font-weight:800;cursor:pointer}.tab.active{background:#172033;color:#fff}.panel{display:none}.panel.active{display:block}.notice{padding:13px;border-radius:10px;background:#eef6ff;margin-top:10px}.success{padding:13px;border-radius:10px;background:#eaf8ef;color:#17643a;margin-top:10px}.error{padding:13px;border-radius:10px;background:#fff0f0;color:#a11;margin-top:10px}.bookingrow{border:1px solid #edf0f4;border-radius:12px;padding:13px;margin:9px 0;display:flex;justify-content:space-between;gap:12px}.hidden{display:none!important}.logo{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{margin:10px 0;padding:25px}.hero h1{font-size:31px}.row{grid-template-columns:1fr}.nav{padding:0 16px}.navlinks .btn:first-child{display:none}.wrap{padding:14px}.bookingrow{display:block}.bookingrow .price{margin-top:8px}}
</style>
</head>
<body>
<nav class="nav"><div class="brand" id="navBrand">StayBook</div><div class="navlinks"><button class="btn light" onclick="scrollOwner()">Owner</button><button class="btn" onclick="scrollBooking()">Book Now</button></div></nav>
<div class="wrap">
<section class="hero"><img id="bizLogo"><div><div class="badge" id="bizCat">HOTEL / HOSTEL</div><h1 id="bizName">Your Hotel / Hostel</h1><p id="bizDesc">Choose a service and make your booking directly.</p></div></section>
<main class="grid"><section class="card"><h2>Available Services</h2><div id="services"><p class="muted">Loading...</p></div></section>
<section class="card" id="bookingCard"><h2>Book Now</h2><form id="bookingForm" class="form"><select id="service" required><option value="">Select service</option></select><input id="customerName" placeholder="Customer name" required><input id="customerPhone" placeholder="Mobile number" inputmode="tel" required><input id="customerEmail" type="email" placeholder="Email (optional)"><div class="row"><input id="bookingDate" type="date" required><input id="bookingTime" type="time" required></div><button class="btn green">Confirm Booking</button></form><div id="bookingMsg"></div></section></main>
<section class="owner" id="ownerSection"><div class="card"><h2>Owner Dashboard</h2><div id="authArea"><p class="muted">Create an owner account or login to manage your business.</p><div class="tabs"><button class="tab active" onclick="authMode('login',this)">Login</button><button class="tab" onclick="authMode('signup',this)">Create Account</button></div><div id="loginPanel" class="panel active form"><input id="authEmail" type="email" placeholder="Owner email"><input id="authPassword" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button></div><div id="signupPanel" class="panel form"><input id="signupEmail" type="email" placeholder="Owner email"><input id="signupPassword" type="password" placeholder="Password (min 6)"><button class="btn" onclick="signup()">Create Owner Account</button></div><div id="authMsg"></div></div><div id="dashboard" class="hidden"><div class="tabs"><button class="tab active" onclick="dashTab('business',this)">Business</button><button class="tab" onclick="dashTab('services',this)">Services</button><button class="tab" onclick="dashTab('bookings',this)">Bookings</button><button class="tab" onclick="logout()">Logout</button></div><div id="businessPanel" class="panel active"><h3>Business Profile</h3><div class="form"><input id="businessName" placeholder="Business name"><input id="businessCategory" placeholder="Category e.g. Hostel, Hotel, Resort"><input id="businessLogo" placeholder="Logo image URL"><input id="businessDescription" placeholder="Short description"><button class="btn" onclick="saveBusiness()">Save / Update Business</button></div><div id="businessMsg"></div><div id="shareBox"></div></div><div id="servicesPanel" class="panel"><h3>Add Service</h3><div class="form"><input id="serviceName" placeholder="Service name e.g. Deluxe Room / Bed / AC Room"><input id="serviceDescription" placeholder="Description"><div class="row"><input id="servicePrice" type="number" min="0" placeholder="Price ₹"><input id="serviceDuration" type="number" min="1" value="60" placeholder="Duration minutes"></div><button class="btn" onclick="addService()">Add Service</button></div><div id="serviceMsg"></div><div id="ownerServices"></div></div><div id="bookingsPanel" class="panel"><h3>Customer Bookings</h3><div id="ownerBookings"><p class="muted">No bookings yet.</p></div></div></div></div></section>
</div>
<script>
const SUPA_URL='https://pkofzvbdeljsksecbqzg.supabase.co';
const SUPA_KEY='sb_publishable_oAYg9uDeIYVHQ829qTMTaQ_pXvhG2Kb';
const db=supabase.createClient(SUPA_URL,SUPA_KEY);
let user=null,business=null,services=[];
const params=new URLSearchParams(location.search); const slug=params.get('business');
const $=id=>document.getElementById(id);
function msg(id,text,ok=false){$(id).innerHTML=`<div class="${ok?'success':'error'}">${text}</div>`}
function scrollOwner(){$('ownerSection').scrollIntoView({behavior:'smooth'})}function scrollBooking(){$('bookingCard').scrollIntoView({behavior:'smooth'})}
function authMode(mode,el){document.querySelectorAll('#authArea .tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');$('loginPanel').classList.toggle('active',mode==='login');$('signupPanel').classList.toggle('active',mode==='signup')}
function dashTab(name,el){document.querySelectorAll('#dashboard .tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');['business','services','bookings'].forEach(x=>$(''+x+'Panel').classList.toggle('active',x===name))}
async function signup(){let email=$('signupEmail').value.trim(),password=$('signupPassword').value;if(password.length<6)return msg('authMsg','Password कम से कम 6 characters का रखें।');let r=await db.auth.signUp({email,password});if(r.error)return msg('authMsg',r.error.message);msg('authMsg','Account बन गया। अगर email confirmation on है तो email verify करें, फिर Login करें।',true)}
async function login(){let r=await db.auth.signInWithPassword({email:$('authEmail').value.trim(),password:$('authPassword').value});if(r.error)return msg('authMsg',r.error.message);user=r.data.user;await openDashboard()}
async function logout(){await db.auth.signOut();location.reload()}
async function openDashboard(){ $('authArea').classList.add('hidden');$('dashboard').classList.remove('hidden');await loadOwnerBusiness() }
async function loadOwnerBusiness(){let r=await db.from('businesses').select('*').eq('owner_id',user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();business=r.data||null;if(business){$('businessName').value=business.name||'';$('businessCategory').value=business.category||'';$('businessLogo').value=business.logo_url||'';$('businessDescription').value='';renderShare();await loadOwnerServices();await loadBookings()}else{renderShare();}}
function renderShare(){if(business)$('shareBox').innerHTML=`<div class="notice"><b>Your Booking Page:</b><br><a target="_blank" href="?business=${encodeURIComponent(business.slug)}">${location.origin}${location.pathname}?business=${encodeURIComponent(business.slug)}</a></div>`;else $('shareBox').innerHTML='<div class="notice">पहले Business Profile save करें, फिर आपका unique booking link यहाँ मिलेगा।</div>'}
async function saveBusiness(){if(!user)return;let name=$('businessName').value.trim();if(!name)return msg('businessMsg','Business name डालें।');let category=$('businessCategory').value.trim()||'Hotel / Hostel';let logo=$('businessLogo').value.trim()||null;let desc=$('businessDescription').value.trim();let data={owner_id:user.id,name,category,logo_url:logo};let r;if(business)r=await db.from('businesses').update(data).eq('id',business.id).select().single();else{let slug=(name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'business')+'-'+Math.random().toString(36).slice(2,7);r=await db.from('businesses').insert({...data,slug}).select().single()}if(r.error)return msg('businessMsg',r.error.message);business=r.data;msg('businessMsg','Business profile save हो गया।',true);renderShare();loadPublic()}
async function addService(){if(!business)return msg('serviceMsg','पहले Business Profile save करें।');let name=$('serviceName').value.trim();if(!name)return msg('serviceMsg','Service name डालें।');let r=await db.from('services').insert({business_id:business.id,name,description:$('serviceDescription').value.trim()||null,price:Number($('servicePrice').value||0),duration_minutes:Number($('serviceDuration').value||60),active:true});if(r.error)return msg('serviceMsg',r.error.message);msg('serviceMsg','Service add हो गई।',true);['serviceName','serviceDescription','servicePrice'].forEach(x=>$(x).value='');await loadOwnerServices();await loadPublic()}
async function loadOwnerServices(){if(!business)return;let r=await db.from('services').select('*').eq('business_id',business.id).order('created_at',{ascending:false});let list=r.data||[];$('ownerServices').innerHTML=list.map(s=>`<div class="bookingrow"><div><b>${escapeHtml(s.name)}</b><div class="muted">${escapeHtml(s.description||'')} · ${s.duration_minutes} min</div></div><div class="price">₹${Number(s.price).toLocaleString('en-IN')}</div></div>`).join('')||'<p class="muted">No services added.</p>'}
async function loadBookings(){if(!business)return;let r=await db.from('bookings').select('*,services(name)').eq('business_id',business.id).order('booking_date',{ascending:false}).order('booking_time',{ascending:false});let list=r.data||[];$('ownerBookings').innerHTML=list.map(b=>`<div class="bookingrow"><div><b>${escapeHtml(b.customer_name)}</b><div class="muted">${escapeHtml(b.customer_phone)} · ${escapeHtml(b.customer_email||'')}</div><div>${escapeHtml(b.services?.name||'Service')} · ${b.booking_date} ${String(b.booking_time).slice(0,5)}</div></div><div><b>${b.status}</b><br><span class="muted">₹ booking</span></div></div>`).join('')||'<p class="muted">No bookings yet.</p>'}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadPublic(){if(!slug){$('bizName').textContent=business?.name||'Your Hotel / Hostel';$('bizCat').textContent=business?.category?.toUpperCase()||'HOTEL / HOSTEL';return}let r=await db.from('businesses').select('*').eq('slug',slug).maybeSingle();business=r.data;if(!business){$('bizName').textContent='Business not found';$('services').innerHTML='<p class="error">Invalid booking link.</p>';return} $('navBrand').textContent=business.name;$('bizName').textContent=business.name;$('bizCat').textContent=business.category.toUpperCase();if(business.logo_url){$('bizLogo').src=business.logo_url;$('bizLogo').style.display='block'}let s=await db.from('services').select('*').eq('business_id',business.id).eq('active',true).order('created_at');services=s.data||[];renderServices()}
function renderServices(){$('services').innerHTML=services.map(s=>`<div class="service"><div><b>${escapeHtml(s.name)}</b><div class="muted">${escapeHtml(s.description||'')} · ${s.duration_minutes} min</div></div><div class="price">₹${Number(s.price).toLocaleString('en-IN')}</div></div>`).join('')||'<p class="muted">No services available.</p>';$('service').innerHTML='<option value="">Select service</option>'+services.map(s=>`<option value="${s.id}">${escapeHtml(s.name)} — ₹${Number(s.price).toLocaleString('en-IN')}</option>`).join('')}
$('bookingForm').addEventListener('submit',async e=>{e.preventDefault();if(!business)return msg('bookingMsg','इस booking page का business नहीं मिला।');let r=await db.from('bookings').insert({business_id:business.id,service_id:$('service').value,customer_name:$('customerName').value.trim(),customer_phone:$('customerPhone').value.trim(),customer_email:$('customerEmail').value.trim()||null,booking_date:$('bookingDate').value,booking_time:$('bookingTime').value,status:'confirmed'});if(r.error)return msg('bookingMsg',r.error.message);msg('bookingMsg','Booking successfully confirmed! Owner को booking dashboard में दिखाई देगी।',true);e.target.reset();if(user&&business.owner_id===user.id)loadBookings()});
async function init(){let s=new Date();s.setMinutes(s.getMinutes()-s.getTimezoneOffset());$('bookingDate').min=s.toISOString().slice(0,10);let session=await db.auth.getSession();if(session.data.session){user=session.data.session.user;openDashboard()}await loadPublic()}
init();
</script></body></html>
