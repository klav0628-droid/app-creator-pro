<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hostel & Hotel Booking</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.nav{background:#fff;padding:16px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #ddd;position:sticky;top:0}.brand{font-weight:800;font-size:20px}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{padding:35px;border-radius:22px;background:linear-gradient(135deg,#172033,#41698f);color:#fff;margin-bottom:20px}.hero h1{font-size:40px}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:20px}.card{background:#fff;border-radius:16px;padding:22px;margin-bottom:20px}.service,.booking{border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:12px}.price{font-weight:bold}.form{display:grid;gap:10px}input,select{padding:12px;border:1px solid #ccd2dc;border-radius:9px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{padding:11px 16px;border:0;border-radius:9px;background:#172033;color:white;font-weight:bold;cursor:pointer}.light{background:#eef1f6;color:#172033}.success{background:#e9f8ef;color:#17643a;padding:12px;border-radius:9px;margin-top:10px}.error{background:#fff0f0;color:#a11;padding:12px;border-radius:9px;margin-top:10px}.muted{color:#667085;font-size:14px}.hidden{display:none}.owner{margin-top:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}.row{grid-template-columns:1fr}}
</style></head><body><nav class="nav"><div class="brand" id="brand">Hostel & Hotel Booking</div><button class="btn light" onclick="document.getElementById('owner').scrollIntoView()">Owner Panel</button></nav><div class="wrap"><section class="hero"><div id="cat">HOTEL / HOSTEL</div><h1 id="title">Your Hostel / Hotel</h1><p id="desc">Book rooms and services directly.</p></section><div class="grid"><section class="card"><h2>Rooms / Services</h2><div id="services">Loading...</div></section><section class="card"><h2>Book Now</h2><form id="book" class="form"><select id="service" required><option value="">Select service</option></select><input id="name" placeholder="Customer name" required><input id="phone" placeholder="Mobile number" required><input id="email" type="email" placeholder="Email (optional)"><div class="row"><input id="date" type="date" required><input id="time" type="time" required></div><button class="btn">Confirm Booking</button></form><div id="bookMsg"></div></section></div><section id="owner" class="card owner"><h2>Owner Dashboard</h2><div id="auth"><p class="muted">Owner login required to create and manage your business.</p><div class="form"><input id="emailLogin" type="email" placeholder="Owner email"><input id="passLogin" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><button class="btn light" onclick="signup()">Create Owner Account</button></div><div id="authMsg"></div></div><div id="dash" class="hidden"><h3>Business Profile</h3><div class="form"><input id="bname" placeholder="Business Name"><input id="bcat" placeholder="Category: Hostel / Hotel / Resort"><input id="blogo" placeholder="Logo image URL"><input id="bdesc" placeholder="Business description"><button class="btn" onclick="saveBusiness()">Save Business</button></div><div id="bizMsg"></div><h3>Add Room / Service</h3><div class="form"><input id="sname" placeholder="Service name"><input id="sdesc" placeholder="Description"><div class="row"><input id="sprice" type="number" min="0" placeholder="Price ₹"><input id="sdur" type="number" min="1" value="60" placeholder="Duration minutes"></div><button class="btn" onclick="addService()">Add Service</button></div><div id="svcMsg"></div><h3>Customer Bookings</h3><div id="bookings">No bookings yet.</div><div id="share"></div></div></section></div><script>const URL='https://pkofzvbdeljsksecbqzg.supabase.co',KEY='sb_publishable_oAYg9uDeIYVHQ829qTMTaQ_pXvhG2Kb',db=supabase.createClient(URL,KEY);let user=null,business=null,services=[];const q=new URLSearchParams(location.search),slug=q.get('business'),$=x=>document.getElementById(x);const show=(id,t,ok=false)=>$(id).innerHTML='<div class="'+(ok?'success':'error')+'">'+t+'</div>';async function loadPublic(){if(!slug){return}let r=await db.from('hotel_businesses').select('*').eq('slug',slug).maybeSingle();if(r.error){show('services',r.error.message);return}business=r.data;if(!business){$('title').textContent='Business not found';$('services').textContent='Invalid booking link';return}$('brand').textContent=business.name;$('title').textContent=business.name;$('cat').textContent=(business.category||'HOTEL').toUpperCase();$('desc').textContent=business.description||'Book rooms and services directly.';let s=await db.from('hotel_services').select('*').eq('business_id',business.id).eq('active',true).order('created_at');services=s.data||[];render()};function render(){$('services').innerHTML=services.map(s=>'<div class="service"><div><b>'+esc(s.name)+'</b><div class="muted">'+esc(s.description||'')+'</div></div><div class="price">₹'+Number(s.price).toLocaleString('en-IN')+'</div></div>').join('')||'<p class="muted">No services added.</p>';$('service').innerHTML='<option value="">Select service</option>'+services.map(s=>'<option value="'+s.id+'">'+esc(s.name)+' — ₹'+Number(s.price).toLocaleString('en-IN')+'</option>').join('')};function esc(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))};async function signup(){let e=$('emailLogin').value.trim(),p=$('passLogin').value;if(!e||p.length<6)return show('authMsg','Email और कम से कम 6 character password डालें।');let r=await db.auth.signUp({email:e,password:p});show('authMsg',r.error?r.error.message:'Account बन गया। Email confirmation हो तो पहले email verify करें।',!r.error)}async function login(){let r=await db.auth.signInWithPassword({email:$('emailLogin').value.trim(),password:$('passLogin').value});if(r.error)return show('authMsg',r.error.message);user=r.data.user;$('auth').classList.add('hidden');$('dash').classList.remove('hidden');await loadOwner()};async function loadOwner(){let r=await db.from('hotel_businesses').select('*').eq('owner_id',user.id).order('created_at',{ascending:false}).limit(1).maybeSingle();business=r.data;if(business){$('bname').value=business.name||'';$('bcat').value=business.category||'';$('blogo').value=business.logo_url||'';await loadOwnerServices();await loadBookings();$('share').innerHTML='<div class="success">Your Booking Page: <a target="_blank" href="?business='+encodeURIComponent(business.slug)+'">'+location.origin+location.pathname+'?business='+encodeURIComponent(business.slug)+'</a></div>'}}async function saveBusiness(){if(!user)return show('bizMsg','Login first.');let n=$('bname').value.trim();if(!n)return show('bizMsg','Business name required.');let data={owner_id:user.id,name:n,category:$('bcat').value.trim()||'Hotel / Hostel',logo_url:$('blogo').value.trim()||null};let r;if(business)r=await db.from('hotel_businesses').update(data).eq('id',business.id).select().single();else{let sl=n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+Math.random().toString(36).slice(2,7);r=await db.from('hotel_businesses').insert({...data,slug:sl}).select().single()}if(r.error)return show('bizMsg',r.error.message);business=r.data;show('bizMsg','Business saved successfully.',true);await loadOwner();await loadPublic()}async function addService(){if(!business)return show('svcMsg','पहले Business save करें।');let r=await db.from('hotel_services').insert({business_id:business.id,name:$('sname').value.trim(),description:$('sdesc').value.trim()||null,price:Number($('sprice').value||0),duration_minutes:Number($('sdur').value||60),active:true});if(r.error)return show('svcMsg',r.error.message);show('svcMsg','Service added.',true);await loadOwnerServices();await loadPublic()}async function loadOwnerServices(){if(!business)return;let r=await db.from('hotel_services').select('*').eq('business_id',business.id).order('created_at',{ascending:false});$('svcMsg').innerHTML=(r.data||[]).map(s=>'<div class="service"><b>'+esc(s.name)+'</b><span>₹'+Number(s.price).toLocaleString('en-IN')+'</span></div>').join('')};async function loadBookings(){if(!business)return;let r=await db.from('hotel_bookings').select('*').eq('business_id',business.id).order('booking_date',{ascending:false});$('bookings').innerHTML=(r.data||[]).map(b=>'<div class="booking"><div><b>'+esc(b.customer_name)+'</b><div class="muted">'+esc(b.customer_phone)+' · '+esc(b.customer_email||'')+'</div><div>'+b.booking_date+' '+String(b.booking_time).slice(0,5)+'</div></div><b>'+esc(b.status)+'</b></div>').join('')||'No bookings yet.'};$('book').addEventListener('submit',async e=>{e.preventDefault();if(!business)return show('bookMsg','Invalid business booking page.');let r=await db.from('hotel_bookings').insert({business_id:business.id,service_id:$('service').value,customer_name:$('name').value.trim(),customer_phone:$('phone').value.trim(),customer_email:$('email').value.trim()||null,booking_date:$('date').value,booking_time:$('time').value,status:'confirmed'});if(r.error)return show('bookMsg',r.error.message);show('bookMsg','Booking confirmed successfully!',true);e.target.reset();if(user)loadBookings()});loadPublic();db.auth.getSession().then(x=>{if(x.data.session){user=x.data.session.user;$('auth').classList.add('hidden');$('dash').classList.remove('hidden');loadOwner()}});</script></body></html>
