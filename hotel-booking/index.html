<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hostel & Hotel Booking</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.nav{background:#fff;padding:14px 5%;display:flex;justify-content:space-between;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:5}.btn{padding:10px 15px;border:0;border-radius:9px;background:#172033;color:#fff;font-weight:700;cursor:pointer}.light{background:#edf1f6;color:#172033}.green{background:#16803d}.wrap,.page{max-width:1100px;margin:auto;padding:20px}.hero{background:#172033;color:#fff;border-radius:18px;padding:28px;display:flex;gap:18px;align-items:center}.hero img{width:80px;height:80px;border-radius:15px;object-fit:cover;background:#fff}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-top:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:15px;padding:20px;margin-bottom:18px}.form{display:grid;gap:10px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd2dc;border-radius:8px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.service,.booking{border:1px solid #e0e4ea;border-radius:12px;padding:12px;margin:10px 0}.service{display:flex;gap:12px}.service img{width:115px;height:90px;object-fit:cover;border-radius:10px}.price{font-weight:800}.muted{color:#667085;font-size:13px}.notice,.success,.error{padding:11px;border-radius:8px;margin-top:10px}.notice{background:#eef6ff}.success{background:#e9f8ef}.error{background:#fff0f0;color:#a11}.hidden{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tab{padding:9px 12px;border:1px solid #ddd;background:#fff;border-radius:8px;font-weight:700}.tab.active{background:#172033;color:#fff}.panel{display:none}.panel.active{display:block}.thumb{width:90px;height:70px;object-fit:cover;border-radius:8px;margin-top:8px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px}.modal>div{background:#fff;padding:20px;border-radius:15px;max-width:600px;width:100%}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.hero h1{font-size:28px}.service{display:block}.service img{width:100%;height:180px}}}</style></head><body><nav class="nav"><b id="brand">Hostel & Hotel Booking</b><div><button class="btn light" onclick="openOwner()">Owner</button> <button class="btn" onclick="scrollBook()">Book Now</button></div></nav><main id="public" class="wrap"><section class="hero"><img id="heroLogo" class="hidden"><div><small id="cat">HOTEL / HOSTEL</small><h1 id="title">Your Hostel / Hotel</h1><p id="desc">Book rooms and services directly.</p></div></section><div class="grid"><section class="card"><h2>Rooms / Services</h2><div id="services">Loading...</div></section><section class="card" id="bookCard"><h2>Book Now</h2><form id="book" class="form"><select id="service" required><option value="">Select service</option></select><input id="name" placeholder="Customer name" required><input id="phone" placeholder="Mobile number" required><input id="email" type="email" placeholder="Email"><div class="row"><input id="date" type="date" required><input id="time" type="time" required></div><button class="btn green">Confirm Booking</button></form><div id="bookMsg"></div></section></div></main><section id="owner" class="page hidden"><div class="card"><button class="btn light" onclick="home()">Customer Page</button><h2>Owner Dashboard</h2><div id="auth"><div class="form"><input id="oe" type="email" placeholder="Owner email"><input id="op" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><button class="btn light" onclick="signup()">Create Owner Account</button></div><div id="authMsg"></div></div><div id="dash" class="hidden"><div class="tabs"><button class="tab active" onclick="tab('profile',this)">Business</button><button class="tab" onclick="tab('svc',this)">Rooms / Services</button><button class="tab" onclick="tab('bookings',this)">Bookings</button><button class="tab" onclick="logout()">Logout</button></div><div id="profilePanel" class="panel active"><div class="form"><input id="bn" placeholder="Business Name"><input id="bc" placeholder="Business Category"><input id="on" placeholder="Owner Name"><input id="oph" placeholder="Owner Mobile"><input id="oem" type="email" placeholder="Owner Email"><textarea id="oa" placeholder="Address"></textarea><textarea id="bd" placeholder="Business Description"></textarea><label><b>Business Logo</b><input id="logo" type="file" accept="image/*"></label><img id="lp" class="thumb hidden"><button class="btn" onclick="saveBiz()">Save Business</button></div><div id="bizMsg"></div><div id="share"></div></div><div id="svcPanel" class="panel"><h3>Add Room / Service</h3><div class="form"><input id="sn" placeholder="Room / Service Name"><input id="sd" placeholder="Description"><div class="row"><input id="sp" type="number" min="0" placeholder="Price ₹"><input id="dur" type="number" min="1" value="60" placeholder="Duration"></div><label><b>Room / Service Photo</b><input id="servicePhoto" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="servicePreview" class="thumb hidden"><button class="btn" onclick="addService()">Add Room / Service</button></div><div id="svcMsg"></div><div id="myServices"></div></div><div id="bookingsPanel" class="panel"><h3>Customer Bookings</h3><div id="myBookings"></div></div></div></div></section><section id="admin" class="page hidden"><div class="card"><button class="btn light" onclick="home()">Customer Page</button><h2>Admin Panel</h2><div id="adminAuth" class="form"><input id="au" placeholder="Admin User ID"><input id="ap" type="password" placeholder="Admin Password"><button class="btn" onclick="adminLogin()">Admin Login</button><div id="am"></div></div><div id="adminDash" class="hidden"><div class="tabs"><button class="tab active" onclick="loadAdmin()">Owners & Bookings</button><button class="tab" onclick="adminLogout()">Logout</button></div><div id="adminData"></div></div></div></section><div id="modal" class="modal hidden"><div><button class="btn light" onclick="closeModal()">Close</button><h3>Edit Booking</h3><div class="form"><input id="en"><input id="ep"><input id="ee"><div class="row"><input id="ed" type="date"><input id="et" type="time"></div><select id="es"><option>confirmed</option><option>pending</option><option>completed</option><option>cancelled</option></select><button class="btn" onclick="saveEdit()">Save</button></div><div id="em"></div></div></div><script>const U='https://pkofzvbdeljsksecbqzg.supabase.co',K='sb_publishable_oAYg9uDeIYVHQ829qTMTaQ_pXvhG2Kb',db=supabase.createClient(U,K),$=id=>document.getElementById(id),P=new URLSearchParams(location.search);let user,biz,svcs=[],editId,adminToken=sessionStorage.getItem('adminToken')||null,adminMode=false;function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function msg(id,t,ok=false){$(id).innerHTML='<div class="'+(ok?'success':'error')+'">'+esc(t)+'</div>'}function openOwner(){location.href=location.pathname+'?owner=1'}function home(){location.href=location.pathname}function scrollBook(){$('bookCard').scrollIntoView({behavior:'smooth'})}function tab(n,e){document.querySelectorAll('#dash .tab').forEach(x=>x.classList.remove('active'));e.classList.add('active');['profile','svc','bookings'].forEach(x=>$(x+'Panel').classList.toggle('active',x===n))}async function publicLoad(){let slug=P.get('business');if(!slug){$('services').innerHTML='<p class="muted">Owner apna business bana kar booking link share kare.</p>';return}let r=await db.from('hotel_businesses').select('*').eq('slug',slug).maybeSingle();if(r.error)return msg('services',r.error.message);biz=r.data;if(!biz){$('title').textContent='Business not found';return}$('brand').textContent=biz.name;$('title').textContent=biz.name;$('cat').textContent=(biz.category||'HOTEL / HOSTEL').toUpperCase();$('desc').textContent=biz.description||'Book rooms and services directly.';if(biz.logo_url){$('heroLogo').src=biz.logo_url;$('heroLogo').classList.remove('hidden')}let s=await db.from('hotel_services').select('*').eq('business_id',biz.id).eq('active',true).order('created_at');svcs=s.data||[];render()}function render(){$('services').innerHTML=svcs.map(s=>'<div class="service">'+(s.photo_url?'<img src="'+esc(s.photo_url)+'">':'')+'<div><b>'+esc(s.name)+'</b><div class="muted">'+esc(s.description||'')+' · '+s.duration_minutes+' min</div><div class="price">₹'+Number(s.price).toLocaleString('en-IN')+'</div></div></div>').join('')||'<p class="muted">No services available.</p>';$('service').innerHTML='<option value="">Select service</option>'+svcs.map(s=>'<option value="'+s.id+'">'+esc(s.name)+' — ₹'+Number(s.price).toLocaleString('en-IN')+'</option>').join('')}async function signup(){let e=$('oe').value.trim(),p=$('op').value;if(!e||p.length<6)return msg('authMsg','Email aur minimum 6 character password dein.');let r=await db.auth.signUp({email:e,password:p});msg('authMsg',r.error?r.error.message:'Account created. Email verify karke login karein.',!r.error)}async function login(){let r=await db.auth.signInWithPassword({email:$('oe').value.trim(),password:$('op').value});if(r.error)return msg('authMsg',r.error.message);user=r.data.user;showDash()}async function showDash(){$('auth').classList.add('hidden');$('dash').classList.remove('hidden');await loadOwner()}async function logout(){await db.auth.signOut();location.reload()}async function loadOwner(){let r=await db.from('hotel_businesses').select('*').eq('owner_id',user.id).limit(1).maybeSingle();biz=r.data||null;if(!biz)return;$('bn').value=biz.name||'';$('bc').value=biz.category||'';$('on').value=biz.owner_name||'';$('oph').value=biz.owner_phone||'';$('oem').value=biz.owner_email||user.email||'';$('oa').value=biz.owner_address||'';$('bd').value=biz.description||'';if(biz.logo_url){$('lp').src=biz.logo_url;$('lp').classList.remove('hidden')}$('share').innerHTML='<div class="notice"><b>Booking Link:</b><br><a target="_blank" href="'+location.origin+location.pathname+'?business='+encodeURIComponent(biz.slug)+'">'+location.origin+location.pathname+'?business='+encodeURIComponent(biz.slug)+'</a></div>';loadServices();loadBookings()}async function upload(bucket,path,file){let r=await db.storage.from(bucket).upload(path,file,{upsert:true,contentType:file.type});if(r.error)throw r.error;return db.storage.from(bucket).getPublicUrl(path).data.publicUrl}async function saveBiz(){if(!user)return;let name=$('bn').value.trim();if(!name)return msg('bizMsg','Business Name required.');let logo=biz?.logo_url||null,f=$('logo').files[0];if(f)try{logo=await upload('business-logos',user.id+'/'+crypto.randomUUID()+'.'+f.name.split('.').pop(),f)}catch(e){return msg('bizMsg',e.message)}let data={owner_id:user.id,name,category:$('bc').value.trim()||'Hotel / Hostel',logo_url:logo,owner_name:$('on').value.trim(),owner_phone:$('oph').value.trim(),owner_email:$('oem').value.trim(),owner_address:$('oa').value.trim(),description:$('bd').value.trim()};let r=biz?await db.from('hotel_businesses').update(data).eq('id',biz.id).select().single():await db.from('hotel_businesses').insert({...data,slug:name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')+'-'+Math.random().toString(36).slice(2,7)}).select().single();if(r.error)return msg('bizMsg',r.error.message);biz=r.data;msg('bizMsg','Business saved.',true);loadOwner()}async function addService(){if(!biz)return msg('svcMsg','Pehle Business save karein.');let name=$('sn').value.trim();if(!name)return msg('svcMsg','Room / Service name required.');let r=await db.from('hotel_services').insert({business_id:biz.id,name,description:$('sd').value.trim()||null,price:Number($('sp').value||0),duration_minutes:Number($('dur').value||60),active:true}).select().single();if(r.error)return msg('svcMsg',r.error.message);let f=$('servicePhoto').files[0];if(f)try{let url=await upload('service-photos',user.id+'/'+r.data.id+'/'+crypto.randomUUID()+'.'+f.name.split('.').pop(),f);let u=await db.from('hotel_services').update({photo_url:url}).eq('id',r.data.id);if(u.error)return msg('svcMsg',u.error.message)}catch(e){return msg('svcMsg',e.message)}msg('svcMsg','Room / Service photo ke saath add ho gaya.',true);['sn','sd','sp'].forEach(x=>$(x).value='');$('servicePhoto').value='';$('servicePreview').classList.add('hidden');loadServices();publicLoad()}async function loadServices(){if(!biz)return;let r=await db.from('hotel_services').select('*').eq('business_id',biz.id).order('created_at',{ascending:false});$('myServices').innerHTML=(r.data||[]).map(s=>'<div class="service">'+(s.photo_url?'<img src="'+esc(s.photo_url)+'">':'')+'<div><b>'+esc(s.name)+'</b><div class="muted">'+esc(s.description||'')+'</div><b>₹'+Number(s.price).toLocaleString('en-IN')+'</b></div></div>').join('')||'<p class="muted">No services.</p>'}async function loadBookings(){if(!biz)return;let r=await db.from('hotel_bookings').select('*,hotel_services(name,price)').eq('business_id',biz.id).order('created_at',{ascending:false});$('myBookings').innerHTML=(r.data||[]).map(b=>'<div class="booking"><b>'+esc(b.customer_name)+'</b><div>Mobile: '+esc(b.customer_phone)+' | Email: '+esc(b.customer_email||'-')+'</div><div>Service: '+esc(b.hotel_services?.name||'-')+' | ₹'+Number(b.hotel_services?.price||0).toLocaleString('en-IN')+'</div><div>Date: '+esc(b.booking_date)+' | Time: '+esc(String(b.booking_time).slice(0,5))+'</div><div>Status: <b>'+esc(b.status)+'</b></div><button class="btn" onclick=\'editBooking('+JSON.stringify(b)+')\'>Edit</button></div>').join('')||'<p class="muted">No bookings yet.</p>'}function editBooking(b){adminMode=false;editId=b.id;$('en').value=b.customer_name||'';$('ep').value=b.customer_phone||'';$('ee').value=b.customer_email||'';$('ed').value=b.booking_date||'';$('et').value=String(b.booking_time||'').slice(0,5);$('es').value=b.status||'confirmed';$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}async function saveEdit(){let r=adminMode?await db.rpc('admin_update_booking',{p_token:adminToken,p_booking_id:editId,p_status:$('es').value,p_date:$('ed').value,p_time:$('et').value,p_customer_name:$('en').value.trim(),p_customer_phone:$('ep').value.trim(),p_customer_email:$('ee').value.trim()||null}):await db.from('hotel_bookings').update({customer_name:$('en').value.trim(),customer_phone:$('ep').value.trim(),customer_email:$('ee').value.trim()||null,booking_date:$('ed').value,booking_time:$('et').value,status:$('es').value}).eq('id',editId).eq('business_id',biz.id);if(r.error)return msg('em',r.error.message);closeModal();adminMode?loadAdmin():loadBookings();msg('em','Booking updated.',true)}async function adminLogin(){let r=await db.rpc('admin_login',{p_username:$('au').value.trim(),p_password:$('ap').value});if(r.error)return msg('am',r.error.message);if(!r.data?.ok)return msg('am',r.data?.message||'Invalid login');adminToken=r.data.token;sessionStorage.setItem('adminToken',adminToken);$('adminAuth').classList.add('hidden');$('adminDash').classList.remove('hidden');loadAdmin()}async function loadAdmin(){let r=await db.rpc('admin_overview',{p_token:adminToken});if(r.error)return msg('am',r.error.message);let o=r.data.owners||[],b=r.data.bookings||[];$('adminData').innerHTML='<h3>Owners ('+o.length+')</h3>'+o.map(x=>'<div class="booking"><b>'+esc(x.name)+'</b><div>Owner: '+esc(x.owner_name||'-')+' | '+esc(x.owner_phone||'-')+' | '+esc(x.owner_email||x.auth_email||'-')+'</div><div>Bookings: '+x.booking_count+'</div></div>').join('')+'<h3>All Bookings ('+b.length+')</h3>'+b.map(x=>'<div class="booking"><b>'+esc(x.business_name)+'</b><div>Customer: '+esc(x.customer_name)+' | '+esc(x.customer_phone)+'</div><div>Service: '+esc(x.service_name||'-')+' | Date: '+esc(x.booking_date)+' '+esc(String(x.booking_time).slice(0,5))+'</div><div>Status: '+esc(x.status)+'</div><button class="btn" onclick=\'adminEdit('+JSON.stringify(x)+')\'>Edit</button></div>').join('')}function adminEdit(b){adminMode=true;editId=b.id;$('en').value=b.customer_name||'';$('ep').value=b.customer_phone||'';$('ee').value=b.customer_email||'';$('ed').value=b.booking_date||'';$('et').value=String(b.booking_time||'').slice(0,5);$('es').value=b.status||'confirmed';$('modal').classList.remove('hidden')}function adminLogout(){sessionStorage.removeItem('adminToken');location.reload()}$('book').addEventListener('submit',async e=>{e.preventDefault();if(!biz)return msg('bookMsg','Invalid booking page.');let r=await db.from('hotel_bookings').insert({business_id:biz.id,service_id:$('service').value,customer_name:$('name').value.trim(),customer_phone:$('phone').value.trim(),customer_email:$('email').value.trim()||null,booking_date:$('date').value,booking_time:$('time').value,status:'confirmed'});if(r.error)return msg('bookMsg',r.error.message);msg('bookMsg','Booking confirmed successfully!',true);e.target.reset()});$('servicePhoto').addEventListener('change',e=>{let f=e.target.files[0];if(f){$('servicePreview').src=URL.createObjectURL(f);$('servicePreview').classList.remove('hidden')}});async function init(){let m=P.get('owner'),a=P.get('admin');if(a){$('public').classList.add('hidden');$('admin').classList.remove('hidden');if(adminToken){$('adminAuth').classList.add('hidden');$('adminDash').classList.remove('hidden');loadAdmin()}return}if(m){$('public').classList.add('hidden');$('owner').classList.remove('hidden');let s=await db.auth.getSession();if(s.data.session){user=s.data.session.user;showDash()}return}publicLoad()}init();</script></body></html>
