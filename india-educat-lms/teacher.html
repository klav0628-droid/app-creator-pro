<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Portal</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}main{max-width:1000px;margin:auto;padding:24px}.box{background:#fff;padding:20px;margin:14px 0;border-radius:14px;border:1px solid #ddd}input,textarea{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px}button{padding:11px 16px;margin:5px;border:0;border-radius:8px;background:#155eef;color:#fff;font-weight:bold;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.row{grid-template-columns:1fr}}</style></head><body><main><h1>Teacher Portal</h1><div class="box"><h2>Login / Register</h2><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="registerTeacher()">Register</button><button onclick="loginTeacher()">Login</button><button onclick="logoutTeacher()">Logout</button><p id="msg"></p></div><div class="box"><h2>Teacher Tools</h2><p>Login के बाद यहाँ live class, recorded class, notes, tests और assignments manage होंगे।</p><div class="row"><button onclick="location.href='teacher-classes.html'">Live / Recorded Classes</button><button onclick="location.href='teacher-materials.html'">Notes</button><button onclick="location.href='teacher-tests.html'">Tests</button><button onclick="location.href='teacher-assignments.html'">Assignments</button></div></div><div class="box"><h2>Student Requests</h2><p>Student teacher email से join request भेजेगा। Approval के बाद student को आपकी classes और materials दिखाई देंगी।</p><button onclick="location.href='teacher-requests.html'">Open Requests</button></div></main><script>const SUPABASE_URL='https://covyitnajpgdmehtuxpv.supabase.co';const SUPABASE_PUBLISHABLE_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';function saveSession(d){localStorage.setItem('lms_access_token',d.access_token||'');localStorage.setItem('lms_user_id',d.user?.id||'')}async function registerTeacher(){if(SUPABASE_PUBLISHABLE_KEY.startsWith('YOUR_')){msg.textContent='Supabase publishable key configure करना बाकी है.';return}const r=await fetch(SUPABASE_URL+'/auth/v1/signup',{method:'POST',headers:{apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,data:{role:'teacher',full_name:name.value}})});const d=await r.json();msg.textContent=r.ok?'Registration successful. Email verification required हो सकती है.':(d.msg||d.message||'Registration failed')}async function loginTeacher(){if(SUPABASE_PUBLISHABLE_KEY.startsWith('YOUR_')){msg.textContent='Supabase publishable key configure करना बाकी है.';return}const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(r.ok){saveSession(d);location.href='teacher-dashboard.html'}else msg.textContent=d.error_description||'Login failed'}function logoutTeacher(){localStorage.removeItem('lms_access_token');localStorage.removeItem('lms_user_id');msg.textContent='Logged out'}</script></body></html>
