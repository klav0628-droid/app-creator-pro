<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Portal</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}main{max-width:1050px;margin:auto;padding:24px}.box{background:#fff;padding:20px;margin:14px 0;border-radius:14px;border:1px solid #ddd}input{width:100%;box-sizing:border-box;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:8px}button{padding:11px 15px;margin:5px;border:0;border-radius:8px;background:#155eef;color:#fff;font-weight:bold;cursor:pointer}.danger{background:#c62828}.tabs button{background:#fff;color:#172033;border:1px solid #ccc}.item{padding:14px;border:1px solid #e1e5eb;border-radius:10px;margin:8px 0}.muted{color:#667085}.idcard{border:2px solid #155eef;border-radius:16px;padding:20px;max-width:420px}.video{width:100%;max-height:480px;border-radius:10px;background:#000}.hidden{display:none}</style></head><body><main><h1>Student Dashboard</h1><div class="box"><h2>Login / Register</h2><input id="name" placeholder="Full name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="signup()">Register</button><button onclick="login()">Login</button><button class="danger" onclick="logout()">Logout</button><p id="msg"></p></div><div id="app" class="hidden"><div class="box"><h2>Join Teacher</h2><input id="teacherEmail" type="email" placeholder="Teacher email"><button onclick="joinTeacher()">Send Join Request</button><p id="joinMsg"></p></div><div class="tabs"><button onclick="loadClasses()">Live / Recorded Classes</button><button onclick="loadMaterials()">Notes</button><button onclick="showId()">View ID Card</button></div><div id="content"></div></div></main><script>const SUPABASE_URL='https://covyitnajpgdmehtuxpv.supabase.co';const SUPABASE_KEY=window.SUPABASE_PUBLISHABLE_KEY||'';let token=localStorage.getItem('lms_student_token'),uid=localStorage.getItem('lms_student_uid');function headers(){return {apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'}}async function auth(path,body){return fetch(SUPABASE_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})}async function signup(){if(!SUPABASE_KEY){msg.textContent='Supabase publishable key configure करें';return}let r=await auth('signup',{email:email.value,password:password.value,data:{role:'student',full_name:name.value}});let d=await r.json();msg.textContent=r.ok?'Registration successful. Email verification may be required.':(d.msg||d.message||'Registration failed')}async function login(){if(!SUPABASE_KEY){msg.textContent='Supabase publishable key configure करें';return}let r=await auth('token?grant_type=password',{email:email.value,password:password.value});let d=await r.json();if(!r.ok){msg.textContent=d.error_description||'Login failed';return}token=d.access_token;uid=d.user.id;localStorage.setItem('lms_student_token',token);localStorage.setItem('lms_student_uid',uid);app.classList.remove('hidden');msg.textContent='Login successful';loadClasses()}function logout(){localStorage.removeItem('lms_student_token');localStorage.removeItem('lms_student_uid');location.reload()}async function api(path,opt={}){return fetch(SUPABASE_URL+'/rest/v1/'+path,{...opt,headers:{...headers(),...(opt.headers||{})}})}async function joinTeacher(){let e=teacherEmail.value.trim();if(!e)return;let r=await api('profiles?select=id,email,role&email=eq.'+encodeURIComponent(e)+'&role=eq.teacher');let a=await r.json();if(!r.ok||!a.length){joinMsg.textContent='Teacher email नहीं मिला';return}let rr=await api('enrollments',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({teacher_id:a[0].id,student_id:uid,status:'pending'})});joinMsg.textContent=rr.ok?'Join request भेज दी गई':'Request पहले से मौजूद हो सकती है'}async function loadClasses(){content.innerHTML='<div class="box">Loading...</div>';let r=await api('enrollments?select=teacher_id&student_id=eq.'+uid+'&status=eq.approved');let e=await r.json();if(!e.length){content.innerHTML='<div class="box">पहले teacher को join करें और approval का इंतजार करें.</div>';return}let ids=e.map(x=>x.teacher_id);let q=ids.map(x=>'teacher_id.eq.'+x).join(',');let cr=await api('classes?select=*&or=('+q+')&order=starts_at.asc');let c=await cr.json();content.innerHTML='<div class="box"><h2>Classes</h2>'+(c.length?c.map(x=>'<div class="item"><h3>'+esc(x.title)+'</h3><p>'+esc(x.description||'')+'</p>'+(x.live_url?'<a href="'+esc(x.live_url)+'" target="_blank"><button>Join Live Class</button></a>':'')+(x.recording_url?video(x.recording_url):'')+'</div>').join(''):'No classes yet')+'</div>'}async function loadMaterials(){let r=await api('enrollments?select=teacher_id&student_id=eq.'+uid+'&status=eq.approved');let e=await r.json();if(!e.length){content.innerHTML='<div class="box">No approved teacher.</div>';return}let q=e.map(x=>'teacher_id.eq.'+x.teacher_id).join(',');let r2=await api('materials?select=*&or=('+q+')&order=created_at.desc');let a=await r2.json();content.innerHTML='<div class="box"><h2>Notes</h2>'+(a.length?a.map(x=>'<div class="item"><b>'+esc(x.title)+'</b><br><a href="'+esc(x.file_url||'#')+'" target="_blank">Open / Download</a></div>').join(''):'No notes yet')+'</div>'}function video(u){let safe=esc(u);if(/\.mp4($|\?)/i.test(u))return '<video class="video" controls playsinline src="'+safe+'"></video>';return '<p><a href="'+safe+'" target="_blank"><button>Watch Recording</button></a></p>'}function showId(){content.innerHTML='<div class="box"><h2>Student ID Card</h2><div class="idcard"><h2>STUDENT ID</h2><p><b>Name:</b> '+esc(name.value||'Student')+'</p><p><b>Email:</b> '+esc(email.value)+'</p><p><b>Student ID:</b> '+esc(uid||'Not logged in')+'</p><button onclick="window.print()">Print / Save PDF</button></div></div>'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}if(token){app.classList.remove('hidden');loadClasses()}</script></body></html>
